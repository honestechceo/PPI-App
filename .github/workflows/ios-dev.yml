# Test build of the iPhone app for registered iPhones (Tap to Pay on iPhone testing).
# Apple's Tap to Pay *development* entitlement only works in development-signed builds installed on iPhones
# registered to the developer account; TestFlight and the App Store need the publishing entitlement later.
#  - Run by hand (Actions → "iPhone test build" → Run workflow), or on pushes to the ttp-test branch.
#  - Repo variable TEST_DEVICES: "Juan iPhone=00008110-XXXXXXXXXXXXXXXX" (comma-separated for more).
#    Get an iPhone's ID at https://honestechmobileapp.com/udid.html
#  - Install: open https://honestechmobileapp.com/devbuild.html on the registered iPhone in Safari.
# Uses the same Apple secrets as the TestFlight workflow.
name: iPhone test build
on:
  workflow_dispatch:
  push:
    branches: [ttp-test]
concurrency:
  group: ios-dev
  cancel-in-progress: true
permissions:
  contents: write
env:
  APP_VERSION: "1.1"
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEST_DEVICES: ${{ vars.TEST_DEVICES }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: App files (www/)
        run: |
          python3 build.py --www
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          while read -r url _ local; do
            [ -n "$url" ] || continue
            curl -fsSL --retry 3 "$url" -o "www/$local"
          done < www/vendor/SOURCES.txt
          python3 ios/ci/bundle_json.py www
      - name: Sync into the Xcode project
        run: npx cap sync ios
      - name: Development certificate, test iPhones and profiles
        run: |
          set -o pipefail
          KEYDIR="$RUNNER_TEMP/keys"; mkdir -p "$KEYDIR"
          KEY="$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
          body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/\\n//g' -e 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          openssl pkey -in "$KEY" -noout 2>/dev/null || { echo "::error::The ASC_KEY_P8 secret isn't a complete Apple key."; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          ASC_KEY_PATH="$KEY" SIGN_MODE=dev BUNDLE_ID=com.honestechmobileapp.app python3 ios/ci/signing.py
      - name: Build and sign for the test iPhones
        run: |
          set -o pipefail
          show_errors() { grep -E "error:|Error|failed|No profiles|No signing|requires a provisioning|not registered|Provisioning|entitlement" "$1" | grep -v "warning:" | sort -u | tail -25 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; tail -60 "$1"; }
          python3 - <<'PY'
          import os, re
          p = "ios/App/App.xcodeproj/project.pbxproj"; s = open(p).read()
          team = os.environ["APPLE_TEAM_ID"]
          profs = {"com.honestechmobileapp.app": os.environ["PROFILE_NAME"], os.environ["WIDGET_BUNDLE_ID"]: os.environ["WIDGET_PROFILE_NAME"]}
          blocks = re.findall(r"buildSettings = \{[^{}]*CODE_SIGN_ENTITLEMENTS[^{}]*\}", s)
          assert len(blocks) == 4, len(blocks)
          for b in blocks:
              bid = re.search(r"PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);", b).group(1).strip('"')
              nb = b.replace("CODE_SIGN_STYLE = Automatic;", f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Development";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profs[bid]}";')
              nb = nb.replace("CODE_SIGN_ENTITLEMENTS = App/App.entitlements;", "CODE_SIGN_ENTITLEMENTS = App/App-TTP.entitlements;")
              s = s.replace(b, nb)
          open(p, "w").write(s)
          PY
          BUILD=$((5000 + ${{ github.run_number }}))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD" archive > "$RUNNER_TEMP/archive.log" 2>&1 || { show_errors "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/archive.log"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>debugging</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key><dict><key>com.honestechmobileapp.app</key><string>${PROFILE_NAME}</string><key>${WIDGET_BUNDLE_ID}</key><string>${WIDGET_PROFILE_NAME}</string></dict>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { show_errors "$RUNNER_TEMP/export.log"; exit 1; }
          ls -la "$RUNNER_TEMP/out"
          IPA=$(ls "$RUNNER_TEMP"/out/*.ipa | head -1); cp "$IPA" "$RUNNER_TEMP/Honestech.ipa"
          # did the Tap to Pay entitlement make it into the signed app?
          mkdir -p "$RUNNER_TEMP/chk" && cd "$RUNNER_TEMP/chk" && unzip -q "$RUNNER_TEMP/Honestech.ipa"
          if codesign -d --entitlements - Payload/App.app 2>/dev/null | grep -q "proximity-reader.payment.acceptance"; then
            echo "::notice::The test build has Tap to Pay on iPhone."
          else
            echo "::warning::The test build was signed without Tap to Pay on iPhone."
          fi
      - name: Publish for installing
        run: |
          gh release view devbuild >/dev/null 2>&1 || gh release create devbuild --prerelease --title "iPhone test build" --notes "Test build for registered iPhones. Install from https://honestechmobileapp.com/devbuild.html"
          gh release upload devbuild "$RUNNER_TEMP/Honestech.ipa" --clobber
          gh release edit devbuild --notes "Version $APP_VERSION ($BUILD), built $(date -u '+%b %d %H:%M UTC') from ${GITHUB_SHA::7}. Install on a registered iPhone from https://honestechmobileapp.com/devbuild.html"
          echo "::notice::Test build $APP_VERSION ($BUILD) is ready. On the registered iPhone, open https://honestechmobileapp.com/devbuild.html in Safari."
      - name: Clean up the keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
          [ -n "$SIGN_KEYCHAIN" ] && security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true
