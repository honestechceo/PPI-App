<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Honestech"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#15202b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Honestech Mobile Mechanic App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: field tool. Sticky header with progress + numbered step strip, one inspection stage per screen, big tap targets, fixed prev/next bar. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d5dbe2;
  --accent:#1d5fa8; --accent-ink:#ffffff; --accent-soft:#e2ecf8;
  --good:#1f7a45; --good-soft:#e1f2e8; --mon:#9a6200; --mon-soft:#fbf0d9; --bad:#b42323; --bad-soft:#fbe4e4; --na:#6b7480; --na-soft:#eceff2;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3744;
  --accent:#5c9be0; --accent-ink:#0b1622; --accent-soft:#1b2c40;
  --good:#5cc489; --good-soft:#163024; --mon:#e3a93d; --mon-soft:#33280f; --bad:#f07070; --bad-soft:#3a1a1a; --na:#9aa4ae; --na-soft:#222c36;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3744;
  --accent:#5c9be0; --accent-ink:#0b1622; --accent-soft:#1b2c40;
  --good:#5cc489; --good-soft:#163024; --mon:#e3a93d; --mon-soft:#33280f; --bad:#f07070; --bad-soft:#3a1a1a; --na:#9aa4ae; --na-soft:#222c36;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:760px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand{align-items:center}
.brand h1{flex:1;min-width:0}
.brand h1 .b2{color:var(--accent);white-space:nowrap}
.brand h1 small{font-size:.6em;letter-spacing:.12em;margin-left:2px;color:var(--muted);vertical-align:middle}
.brand-r{flex:0 0 auto}
@media (max-width:560px){.brand h1{font-size:18px;line-height:1.05}.brand h1 .b1,.brand h1 .b2{display:block}}
@media (max-width:400px){.brand h1 .b2{white-space:normal}.navbtn{padding:6px 8px;font-size:12px}}
.brand .veh{font-size:13px;color:var(--muted);text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 6px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--na-soft);font-family:var(--f-mono);font-size:11px;color:var(--ink)}
.step.done b{background:var(--good);color:var(--surface)}
.step.flag b{background:var(--bad);color:var(--surface)}
.step.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.sample{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--mon-soft);border:1px solid var(--mon);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.stage-head{margin:4px 0 14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stage-head h2{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;margin:2px 0 6px;text-wrap:balance}
.when{color:var(--muted);max-width:62ch;margin:0}
.when strong{color:var(--ink)}

.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px}
.item[data-r="good"]{border-left-color:var(--good)}
.item[data-r="mon"]{border-left-color:var(--mon)}
.item[data-r="bad"]{border-left-color:var(--bad)}
.item[data-r="na"]{border-left-color:var(--na)}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-label{font-weight:600;min-width:0}
.item-hint{color:var(--muted);font-size:13px;margin-top:2px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;font-weight:600;font-size:14px;min-height:44px}
.rate button[aria-pressed="true"][data-v="good"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.rate button[aria-pressed="true"][data-v="mon"]{background:var(--mon-soft);border-color:var(--mon);color:var(--mon)}
.rate button[aria-pressed="true"][data-v="bad"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.rate button[aria-pressed="true"][data-v="na"]{background:var(--na-soft);border-color:var(--na);color:var(--na)}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.meas{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.meas input{width:72px;border:0;background:transparent;padding:8px 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.meas span{font-size:13px;color:var(--muted);white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.mini input[type=file]{display:none}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:12px}
.axle{grid-column:1/-1;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.corner{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);min-width:0}
.corner[data-cr="good"]{border-left-color:var(--good)} .corner[data-cr="mon"]{border-left-color:var(--mon)} .corner[data-cr="bad"]{border-left-color:var(--bad);background:var(--bad-soft)}
.cname{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);width:22px}
.corner input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:11px 0;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.cunit{font-size:12px;color:var(--muted)}
.note{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px;resize:vertical}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs figure{margin:0;position:relative;width:72px;height:72px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:13px;line-height:1}

.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);width:100%}
.form input.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.vinmsg{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0}
.vinmsg.ok{color:var(--good)} .vinmsg.err{color:var(--bad)}
.subh{font-family:var(--f-display);font-size:22px;font-weight:700;margin:6px 0 10px}

nav.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.foot-inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.foot .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.rep-head h3{font-family:var(--f-display);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.rep-head .biz{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:14px 0}
.kv div{min-width:0}
.kv dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--f-mono);font-weight:500}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tally div{border-radius:8px;padding:10px;text-align:center}
.tally strong{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-size:12px}
.t-good{background:var(--good-soft);color:var(--good)} .t-mon{background:var(--mon-soft);color:var(--mon)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-open{background:var(--na-soft);color:var(--na)}
.verdict{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.verdict .opts{display:flex;flex-wrap:wrap;gap:6px}
.verdict button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px}
.verdict button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rep-sec{margin-top:18px}
.rep-sec h4{font-family:var(--f-display);font-size:20px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em}
.rep-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rep-list li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.rep-list li:last-child{border-bottom:0}
.pill{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;min-width:64px;text-align:center}
.p-good{background:var(--good-soft);color:var(--good)} .p-mon{background:var(--mon-soft);color:var(--mon)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-na{background:var(--na-soft);color:var(--na)}
.rep-list .txt{min-width:0}
.rep-list .txt small{display:block;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.copyrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
textarea.copybox{width:100%;min-height:160px;margin-top:10px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px}
@media (max-width:480px){
  .form{grid-template-columns:minmax(0,1fr)}
  .stage-head h2{font-size:28px}
  .tally strong{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* app shell: schedule, settings, invoice */
.brand-r{display:flex;gap:6px;align-items:center;min-width:0}
.navbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.jobbar{display:flex;align-items:center;gap:8px;padding:8px 0 0;min-width:0}
.jobbar .veh{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;margin:0 -2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day strong{font-family:var(--f-display);font-size:22px;line-height:1}
.day i{width:6px;height:6px;border-radius:50%;background:transparent;font-style:normal}
.day.has i{background:var(--accent)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day.all{width:auto;padding:6px 12px;justify-content:center}
.group-h{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.jobs{display:flex;flex-direction:column;gap:10px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px}
.job .when-col{grid-row:span 3;border-right:1px solid var(--line);padding-right:10px}
.job .t{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.job .d{font-size:12px;color:var(--muted)}
.job .who{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.job .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.job .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.st-sched{background:var(--accent-soft);color:var(--accent)} .st-active{background:var(--mon-soft);color:var(--mon)} .st-done{background:var(--na-soft);color:var(--na)} .st-paid{background:var(--good-soft);color:var(--good)} .st-unpaid{background:var(--bad-soft);color:var(--bad)}
.mini.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini.del{color:var(--bad)}
.emptybox{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.formh{grid-column:1/-1;font-family:var(--f-display);font-size:20px;font-weight:700;margin:0}
.formacts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.help{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.check{flex-direction:row!important;align-items:center;gap:10px!important;text-transform:none!important;letter-spacing:0!important;font-size:15px!important;color:var(--ink)!important;font-weight:500!important}
.check input{width:22px!important;height:22px}
/* invoice */
.inv-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.inv-table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 0;border-bottom:1px solid var(--line)}
.inv-table th:last-child,.inv-table td.amt{text-align:right}
.inv-table td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.inv-table td.amt{width:120px}
.inv-table input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 8px;width:100%}
.inv-table td.amt input{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inv-table .sub{display:block;font-size:12px;color:var(--muted)}
.rowx{display:flex;gap:6px;align-items:center}
.rowx input.dist{width:70px}
.xbtn{border:0;background:transparent;color:var(--bad);font-size:18px;padding:4px 8px}
.totals{margin-top:10px;margin-left:auto;max-width:280px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.totals dt{color:var(--muted)}
.totals dd{margin:0;text-align:right;font-family:var(--f-mono)}
.totals .grand{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--ink)}
.paybox{margin-top:16px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);white-space:pre-line;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.paidstamp{display:inline-block;border:2px solid var(--good);color:var(--good);font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.1em;padding:2px 10px;border-radius:6px;transform:rotate(-4deg)}
.logo-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-box{width:120px;height:72px;border:1px dashed var(--line);border-radius:10px;background:#ffffff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.logo-box img{max-width:108px;max-height:60px;object-fit:contain}
.logo-box span{font-size:12px;color:#6b7480}
.logo-acts{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.mini input[type=file]{display:none}
.rep-id{display:flex;gap:12px;align-items:center;min-width:0}
.rep-logo{max-height:52px;max-width:120px;object-fit:contain;border-radius:6px;background:#ffffff;padding:4px}
.dl-note{display:none}
.no-dl .dl-note{display:block}
.no-dl .dl-only{display:none!important}
.ck-sec{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ck-sec summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;list-style:none}
.ck-sec summary::-webkit-details-marker{display:none}
.ck-sec summary::after{content:"＋";color:var(--muted);font-weight:400}
.ck-sec[open] summary::after{content:"−"}
.ck-sec summary small{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.ck-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ck-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ck-row.off .ck-label{color:var(--muted);text-decoration:line-through}
.ck-label{min-width:0;font-size:14px;color:var(--ink)}
.ck-label small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px;vertical-align:middle}
.ck-tog{min-width:76px;justify-content:center}
.ck-tog[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.ck-addwrap{border:0;border-radius:0;margin:0;background:transparent;padding:12px}
.ck-add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ck-add .full{grid-column:1/-1}
.ck-stage{margin-top:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 6px;font-weight:600;font-size:14px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lines{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ln{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.ln input,.ln select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px;min-width:0;width:100%}
.ln-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ln-top select{width:auto;flex:0 0 auto}
.ln-top input{flex:1}
.ln-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.ln-nums label,.ln-amt{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ln-nums input,.ln-amt input{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.ln-total{display:flex;flex-direction:column;gap:3px;text-align:right}
.ln-total span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ln-total strong{font-family:var(--f-mono);font-size:15px;padding:8px 0;font-variant-numeric:tabular-nums}
.travel-ln{margin-top:10px;flex-direction:row;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.travel-ln .ln-top{flex-direction:column;align-items:flex-start;gap:4px}
.travel-ln input.dist{width:64px;display:inline-block;padding:4px 6px}
.ln-amt{width:120px}
.no-cal .cal-only{display:none!important}
a.mini{text-decoration:none;color:inherit}
a.mini.go{color:var(--accent-ink)}
.job.fu{border-left:4px solid var(--mon)}
.job.fu.od{border-left-color:var(--bad)}
.addr-row{display:flex;gap:8px;align-items:flex-end}
.addr-row label{flex:1;min-width:0}
.addr-row .dir{min-height:44px;margin-bottom:1px}
a.mini.dir{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mitem{display:flex;flex-direction:column;gap:6px;min-width:0}
.mthumb{position:relative;aspect-ratio:4/3;width:100%;max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg) center/cover no-repeat;padding:0}
.mplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:16px;padding-left:3px}
.mdur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px}
.mnone{color:var(--muted);font-size:13px}
.mrow{display:flex;gap:6px;align-items:center}
.mtag{flex:1;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.t-before{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.t-after{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.t-finding{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.mdel{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:32px;height:30px;color:var(--bad);font-weight:700}
.mdel.sure{background:var(--bad);color:#fff;border-color:var(--bad);padding:0 10px}
.mcap{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;font-size:13px;width:100%;min-width:0}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:grid;place-items:center;padding:16px}
.vbox{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:100%;max-height:100%}
.vbox img,.vbox video{max-width:100%;max-height:75vh;border-radius:8px;background:#000}
.vcap{color:#fff;font-size:14px;text-align:center}
.madewith{margin-top:14px;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.04em}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ================= Inspection checklist, in field order ================= */
const BASE_SECTIONS = [
  {id:"arrive", title:"Arrival & Documents", when:"<strong>Before anyone starts the car.</strong> Touch the hood and upper radiator hose to confirm the engine is cold, then match paperwork to the vehicle.",
   items:[
    {id:"cold",label:"Engine is cold on arrival",hint:"A warm engine can hide cold-start noises, smoke, and hard starting"},
    {id:"vinmatch",label:"VIN matches: dash, door jamb, title",hint:"Check for tampered or missing VIN labels"},
    {id:"title",label:"Title status",hint:"Clean, salvage, rebuilt, flood, or lien"},
    {id:"odo",label:"Odometer agrees with records",hint:"Compare with service records, inspection stickers, oil change sticker"},
    {id:"records",label:"Service records available"},
    {id:"keys",label:"Keys and remotes",hint:"Count and test every key fob"},
   ]},
  {id:"ext", title:"Exterior Walkaround", when:"Walk the car clockwise from the driver's door. Look down the body lines in good light.",
   items:[
    {id:"paint",label:"Paint and repaint signs",hint:"Color mismatch, overspray on trim or rubber, orange peel"},
    {id:"gaps",label:"Panel gaps even",hint:"Hood, fenders, doors, trunk"},
    {id:"body",label:"Dents, scratches, collision damage"},
    {id:"rust",label:"Rust: rockers, wheel arches, door bottoms"},
    {id:"glass",label:"Windshield and glass",hint:"Chips, cracks, matching glass brand on all windows"},
    {id:"lenses",label:"Headlight and taillight lenses",hint:"Cracks, moisture, haze, mismatched replacements"},
    {id:"latches",label:"Doors, hood, trunk open and latch"},
    {id:"flood",label:"Flood signs",hint:"Silt in lights or trunk well, corrosion on seat bolts, musty smell"},
   ]},
  {id:"hood", title:"Under Hood — Engine Off", when:"Engine still cold and off. Check levels and condition before the seller runs anything.",
   items:[
    {id:"oil",label:"Engine oil level and condition",hint:"Milky = coolant contamination; sludge on fill cap"},
    {id:"coolant",label:"Coolant level and condition",hint:"Oil film or rust color in reservoir"},
    {id:"brakefl",label:"Brake fluid level and color"},
    {id:"psfl",label:"Power steering fluid"},
    {id:"atf",label:"Transmission fluid (if dipstick)",hint:"Color and smell; burnt smell is a red flag"},
    {id:"belts",label:"Drive belts",hint:"Cracks, glazing, tensioner wobble"},
    {id:"hoses",label:"Radiator and heater hoses",hint:"Soft, swollen, or cracked"},
    {id:"battery",label:"Battery test",hint:"Resting voltage, terminals, date code",measure:{unit:"V",ph:"12.6"}},
    {id:"leaks",label:"Leaks and fresh engine cleaning",hint:"A freshly washed engine bay can hide leaks"},
    {id:"airfilter",label:"Air filter"},
   ]},
  {id:"start", title:"Cold Start & Scan", when:"Plug in the scanner first. Watch the tailpipe and listen during the first 30 seconds.",
   items:[
    {id:"bulbs",label:"Key-on bulb check",hint:"Check engine, ABS, airbag, TPMS lights all light up then go out"},
    {id:"crank",label:"Cold start",hint:"Cranks normally, no long crank or stumble"},
    {id:"noise",label:"Start-up noises",hint:"Timing chain rattle, lifter tick, belt squeal"},
    {id:"smoke",label:"Exhaust smoke",hint:"Blue = oil, white sweet smell = coolant, black = rich"},
    {id:"idle",label:"Idle quality",hint:"Smooth, steady RPM"},
    {id:"codes",label:"Stored and pending codes",hint:"Record every code in the note"},
    {id:"monitors",label:"Readiness monitors",hint:"Several not ready = codes may have been cleared recently"},
    {id:"charging",label:"Charging voltage, engine running",measure:{unit:"V",ph:"14.2"}},
   ]},
  {id:"int", title:"Interior & Electrical", when:"Engine running. Work from the driver's seat outward, then test every exterior light with a helper or reflection.",
   items:[
    {id:"warn",label:"No warning lights on the dash"},
    {id:"gauges",label:"Gauges work",hint:"Temp, fuel, speedometer, tach"},
    {id:"ac",label:"A/C blows cold"},
    {id:"heat",label:"Heat and defrost"},
    {id:"windows",label:"Windows, locks, mirrors"},
    {id:"seats",label:"Seats, belts, adjusters"},
    {id:"radio",label:"Radio, screen, backup camera"},
    {id:"wipers",label:"Wipers, washers, horn"},
    {id:"lights",label:"All exterior lights",hint:"Headlights high/low, signals, brake lights, reverse, plate"},
    {id:"odor",label:"Odors and carpet",hint:"Smoke, mildew, damp carpet, water stains on headliner"},
   ]},
  {id:"wheels", title:"Wheels, Tires & Brakes", when:"Measure tread on all four. Look through the wheel spokes at pads and rotors.",
   items:[
    {id:"tread",label:"Tread depth, each tire",hint:"2/32 or less: repair · 3–4/32: monitor · 5/32+: good",corners:{unit:"/32",ph:"6",repair:2,monitor:4}},
    {id:"wear",label:"Tire wear pattern",hint:"Inner or outer edge wear points to alignment or suspension"},
    {id:"tireage",label:"Tire age (DOT date)",hint:"Older than 6 years should be replaced"},
    {id:"pads",label:"Brake pad thickness, each wheel",hint:"3 mm or less: repair · 4–5 mm: monitor · 6 mm+: good. Record the thinner pad at each wheel.",corners:{unit:"mm",ph:"7",repair:3,monitor:5}},
    {id:"rotors",label:"Rotors",hint:"Lip, scoring, heat spots"},
    {id:"wheels",label:"Wheels and lug nuts",hint:"Curb damage, bends, missing locks"},
    {id:"spare",label:"Spare tire and jack"},
   ]},
  {id:"under", title:"Underbody", when:"Creeper or lift. Bring a flashlight and look at the frame first.",
   items:[
    {id:"frame",label:"Frame and subframe",hint:"Kinks, welds, heavy rust, fresh undercoating over damage"},
    {id:"oilleak",label:"Engine oil leaks",hint:"Oil pan, rear main seal, valve cover"},
    {id:"transleak",label:"Transmission and axle leaks"},
    {id:"exhaust",label:"Exhaust system",hint:"Rust holes, loose hangers, missing heat shields"},
    {id:"susp",label:"Shocks and struts",hint:"Leaking, broken springs"},
    {id:"joints",label:"Ball joints, tie rods, bushings",hint:"Check for play"},
    {id:"cv",label:"CV boots and driveshaft",hint:"Torn boots throw grease"},
    {id:"lines",label:"Brake and fuel lines",hint:"Heavy rust or wet spots"},
   ]},
  {id:"road", title:"Road Test", when:"At least 15 minutes: city stop-and-go, a highway merge, a hard (safe) stop, and a full-lock turn in a parking lot.",
   items:[
    {id:"power",label:"Engine power and acceleration"},
    {id:"shift",label:"Transmission shifts",hint:"Slipping, harsh, delayed engagement"},
    {id:"brakes",label:"Braking",hint:"Straight stop, no pulsation or grinding"},
    {id:"steer",label:"Steering and alignment",hint:"Pull, wander, off-center wheel"},
    {id:"susp2",label:"Ride and suspension noise",hint:"Clunks over bumps"},
    {id:"hum",label:"Wheel bearing hum",hint:"Changes with speed or while turning"},
    {id:"cruise",label:"Cruise control"},
    {id:"awd",label:"4WD / AWD engagement (if equipped)"},
   ]},
  {id:"post", title:"Post-Drive", when:"Park on a clean spot and leave it idling. Hot problems show up now.",
   items:[
    {id:"leaks2",label:"New drips under the car"},
    {id:"temp",label:"Temperature stays normal",hint:"Radiator fan cycles on"},
    {id:"rescan",label:"Rescan for codes",hint:"Codes that set during the drive"},
    {id:"smell",label:"Burning smells or smoke"},
    {id:"restart",label:"Hot restart"},
   ]},
];
const RATES = [["good","Good"],["mon","Monitor"],["bad","Repair"],["na","N/A"]];
const RLABEL = {good:"Good",mon:"Monitor",bad:"Repair",na:"N/A"};
const VERDICTS = [["buy","Recommend"],["buyfix","Recommend with repairs"],["pass","Do not recommend"]];
const PAYMETHODS = ["Cash","Card","Zelle","Cash App","Venmo","Check"];
const CORNERS=[["LF","Left front"],["RF","Right front"],["LR","Left rear"],["RR","Right rear"]];
const KEY = "honestech-ppi-v3";
/* Checklist = built-in items + the mechanic's own items, minus the ones they hide.
   A hidden or removed item still shows on a job that already has a rating for it. */
let SECTIONS,STAGES,ALL_ITEMS;
function customToItem(c){
  const it={id:c.id,label:c.label,hint:c.hint||"",custom:true,removed:!!c.removed};
  if(c.meas==="one")it.measure={unit:c.unit||"",ph:""};
  if(c.meas==="wheels")it.corners={unit:c.unit||"",ph:""};
  return it;
}
function rebuildChecklist(settings){
  const hidden=new Set((settings&&settings.hidden)||[]),custom=(settings&&settings.custom)||[];
  SECTIONS=BASE_SECTIONS.map(b=>{
    const sec={...b};
    sec.items=[...b.items.map(i=>({...i,hidden:hidden.has(i.id)})),...custom.filter(c=>c.sec===b.id).map(customToItem)];
    return sec;
  });
  STAGES=[{id:"intake",title:"Vehicle & Customer"},...SECTIONS,{id:"report",title:"Report"},{id:"invoice",title:"Invoice"}];
  ALL_ITEMS=SECTIONS.flatMap(sec=>sec.items.map(i=>Object.assign(i,{sec})));
}
rebuildChecklist(null);
const itemOn=(it,job)=>!(it.hidden||it.removed)||!!(job&&job.results[it.id]&&job.results[it.id].r);
const secItems=(sec,job=S)=>sec.items.filter(it=>itemOn(it,job));
const jobItems=(job=S)=>ALL_ITEMS.filter(it=>itemOn(it,job));

/* ================= dates & money ================= */
const isoDay=(d)=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const TODAY=isoDay(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoDay(d)};
const fmtDate=(iso,opt={weekday:"short",month:"short",day:"numeric"})=>iso?new Date(iso+"T12:00:00").toLocaleDateString(undefined,opt):"";
const fmtTime=(t)=>{if(!t)return"";const[h,m]=t.split(":").map(Number);return `${(h%12)||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`};
const money=(n)=>(+n||0).toLocaleString("en-US",{style:"currency",currency:"USD"});
const num=(v)=>{const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n};
const uid=()=>Math.random().toString(36).slice(2,9);

/* ================= state ================= */
function defaultSettings(){return {biz:"",owner:"",phone:"",email:"",web:"",fee:100,laborRate:"",jobAlert:"60",mapsApp:"apple",fuMonths:"3",freeMiles:10,perMile:2,taxOn:false,taxRate:6.625,pay:"",terms:"Payment due when the work is complete.",prefix:"INV-",next:1001};}
const isSvc=j=>!!j&&j.type==="service";
const LINE_KINDS=[["labor","Labor"],["part","Part"],["fee","Fee"]];
const RK={labor:"Labor",part:"Part",fee:"Fee"};
const lineAmt=x=>Math.round(num(x.q===""||x.q==null?1:x.q)*num(x.p)*100)/100;
function newJob(info={},type="ppi"){
  return {id:uid(),type,status:"sched",step:0,verdict:"",results:{},
    info:{customer:"",phone:"",date:TODAY,time:"",location:"",dist:"",notes:"",year:"",make:"",model:"",trim:"",vin:"",miles:"",color:"",summary:"",...info},
    invoice:{num:"",date:"",fee:type==="service"?0:null,travelOverride:"",items:[],lines:[],tax:null,paid:false,paidVia:"",paidDate:""}};
}
function sampleApp(){
  const s={...defaultSettings(),biz:"Sample Mobile Mechanic",owner:"Alex Rivera",phone:"(555) 010-0199",email:"service@example.com",web:"example.com",pay:"Zelle: (555) 010-0199\nCash or card accepted on site"};
  const j1=newJob({customer:"Sample buyer",phone:"(555) 010-0142",time:"10:00",location:"Seller driveway, 12 Oak St",dist:"18",year:"2017",make:"Honda",model:"Accord",trim:"EX-L",vin:"1HGCR2F80HA012345",miles:"98412",color:"Silver"});
  j1.status="active";j1.step=4;
  const r=j1.results,set=(id,v,extra={})=>r[id]={r:v,note:"",val:"",photos:[],...extra};
  ["cold","vinmatch","title","records","keys","paint","gaps","glass","lenses","latches","flood","rust","oil","coolant","brakefl","psfl","belts","hoses","airfilter","bulbs","crank","noise","smoke","idle","monitors"].forEach(i=>set(i,"good"));
  set("odo","good",{note:"Matches 2024 inspection sticker"});
  set("body","mon",{note:"Shallow door ding, rear passenger door"});
  set("atf","na",{note:"Sealed unit, no dipstick"});
  set("battery","mon",{val:"12.3",note:"Battery dated 08/2021"});
  set("leaks","mon",{note:"Light seep at valve cover gasket"});
  set("codes","bad",{note:"P0420 stored (catalyst efficiency below threshold, bank 1)"});
  set("charging","good",{val:"14.1"});
  set("tread","mon",{val:{LF:"6",RF:"6",LR:"4",RR:"5"},auto:true});
  set("pads","bad",{val:{LF:"6",RF:"5",LR:"3",RR:"2"},auto:true,note:"Rear pads near metal, replace rear pads and inspect rotors"});
  const j2=newJob({customer:"Sample: Dana K.",phone:"(555) 010-0177",date:addDays(TODAY,1),time:"13:00",location:"Dealer lot, Route 9",dist:"6",year:"2019",make:"Toyota",model:"Tacoma",trim:"TRD Off-Road"});
  const j3=newJob({customer:"Sample: Marcus T.",date:addDays(TODAY,3),time:"09:30",location:"Private seller, Main St",dist:"32",year:"2015",make:"BMW",model:"328i"});
  const j4=newJob({customer:"Sample: Priya S.",date:addDays(TODAY,-1),time:"15:00",location:"Seller's office lot",dist:"12",year:"2018",make:"Ford",model:"F-150",trim:"XLT"});
  j4.status="done";j4.step=STAGES.length-1;j4.verdict="buy";
  ALL_ITEMS.forEach(it=>j4.results[it.id]={r:"good",note:"",val:"",photos:[]});
  j4.invoice={num:"INV-1000",date:addDays(TODAY,-1),fee:100,travelOverride:"",items:[],tax:false,paid:true,paidVia:"Zelle",paidDate:addDays(TODAY,-1)};
  const j5=newJob({customer:"Sample: Maria L.",phone:"(555) 010-0163",date:addDays(TODAY,2),time:"08:30",location:"Customer driveway, Pine Ave",dist:"14",year:"2016",make:"Toyota",model:"Camry",trim:"SE",work:"Front brake pads and rotors, squealing when stopping"},"service");
  j5.invoice.lines=[{k:"labor",d:"Replace front brake pads and rotors",q:"1.5",p:"100"},{k:"part",d:"Front brake pads (ceramic)",q:"1",p:"54.99"},{k:"part",d:"Front rotors",q:"2",p:"62.50"}];
  return {v:3,sample:true,view:"jobs",active:j1.id,day:"",adding:false,draft:null,settings:{...s,laborRate:"100",next:1001},jobs:[j1,j2,j5,j3,j4]};
}
function blankApp(keepSettings){
  return {v:3,sample:false,view:keepSettings?"jobs":"settings",active:null,day:"",adding:false,draft:null,settings:keepSettings||defaultSettings(),jobs:[]};
}
let APP;
try{
  const raw=localStorage.getItem(KEY);
  if(raw) APP=JSON.parse(raw);
  else{
    APP=sampleApp();
    const old=localStorage.getItem("honestech-ppi-v2")||localStorage.getItem("honestech-ppi-v1");
    const o=old&&JSON.parse(old);
    if(o&&!o.sample){ const j=newJob(o.info);j.results=o.results||{};j.verdict=o.verdict||"";j.step=Math.min(o.step||0,STAGES.length-1);j.status="active";
      APP=blankApp(defaultSettings());APP.jobs=[j];APP.view="jobs"; }
  }
}catch(e){ APP=sampleApp(); }
APP.adding=false;
rebuildChecklist(APP.settings);
let S=null; // the job being worked on
function syncActive(){S=APP.jobs.find(j=>j.id===APP.active)||null; if(!S&&APP.view==="job")APP.view="jobs";}
syncActive();

let saveWarned=false;
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(APP)); }
  catch(e){ if(!saveWarned){ toast("Phone storage is full. Remove some photos from older jobs."); saveWarned=true; } }
}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const res=id=>S.results[id]||(S.results[id]={r:"",note:"",val:"",photos:[]});
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
const vehOf=(i)=>[i.year,i.make,i.model,i.trim].filter(Boolean).join(" ");
function bizName(){return APP.settings.biz||"Your business name";}
function bizContact(){const s=APP.settings;return [s.phone,s.email,s.web].filter(Boolean).join(" · ");}
function copyText(txt,boxId){
  const box=boxId&&document.getElementById(boxId);
  const fallback=()=>{if(box){box.value=txt;box.hidden=false;box.focus();box.select();}toast("Text selected. Use your phone's Copy.");};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),fallback);}catch(err){fallback();}
}
function cornerVals(r){ if(!r.val||typeof r.val!=="object") r.val={}; return r.val; }
function cornerRate(c,v){ if(c.repair==null||v===""||v==null||isNaN(+v)) return ""; v=+v; return v<=c.repair?"bad":v<=c.monitor?"mon":"good"; }
function measText(it,r){
  if(!r) return "";
  if(it.corners){const v=(r.val&&typeof r.val==="object")?r.val:{};const parts=CORNERS.filter(([k])=>v[k]!==undefined&&v[k]!=="").map(([k])=>`${k} ${v[k]}`);
    return parts.length?parts.join(" · ")+" "+it.corners.unit:"";}
  return r.val&&it.measure?`${r.val} ${it.measure.unit}`:"";
}
function vinCheck(v){
  v=(v||"").toUpperCase().replace(/\s/g,"");
  if(!v) return {cls:"",msg:""};
  if(/[IOQ]/.test(v)) return {cls:"err",msg:"VINs never contain I, O, or Q"};
  if(v.length!==17) return {cls:"err",msg:`${v.length} of 17 characters`};
  const map={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
  const w=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
  let sum=0;for(let i=0;i<17;i++){const c=v[i];const n=/\d/.test(c)?+c:map[c];if(n===undefined)return{cls:"err",msg:"Invalid character"};sum+=n*w[i]}
  const cd=sum%11===10?"X":String(sum%11);
  return cd===v[8]?{cls:"ok",msg:"Check digit valid"}:{cls:"err",msg:`Check digit fails (expected ${cd} in position 9). Re-read the VIN.`};
}
function stats(job=S){
  let good=0,mon=0,bad=0,na=0;
  const its=jobItems(job);
  its.forEach(i=>{const r=job.results[i.id]?.r;if(r==="good")good++;else if(r==="mon")mon++;else if(r==="bad")bad++;else if(r==="na")na++;});
  const done=good+mon+bad+na;
  return {good,mon,bad,na,done,open:its.length-done,total:its.length};
}

/* ---------- money math ---------- */
function travelCalc(job){
  const st=APP.settings, inv=job.invoice;
  if(inv.travelOverride!==""&&inv.travelOverride!=null) return {fee:num(inv.travelOverride),auto:false};
  const d=num(job.info.dist), billable=Math.max(0,d-num(st.freeMiles));
  return {fee:Math.round(billable*num(st.perMile)),auto:true,billable,d};
}
function totals(job){
  const inv=job.invoice, st=APP.settings;
  if(isSvc(job)){
    const ls=inv.lines||[],sum=k=>ls.filter(x=>x.k===k).reduce((a,x)=>a+lineAmt(x),0);
    const labor=sum("labor"),parts=sum("part"),fees=sum("fee"),tr=travelCalc(job);
    const sub=labor+parts+fees+tr.fee;
    const taxOn=inv.tax==null?!!st.taxOn:inv.tax;
    const tax=taxOn?Math.round(sub*num(st.taxRate))/100:0;
    return {svc:true,fee:0,labor,parts,fees,travel:tr,extras:labor+parts+fees,sub,taxOn,tax,total:sub+tax};
  }
  const fee=inv.fee==null?num(st.fee):num(inv.fee);
  const tr=travelCalc(job);
  const extras=inv.items.reduce((a,x)=>a+num(x.a),0);
  const sub=fee+tr.fee+extras;
  const taxOn=inv.tax==null?!!st.taxOn:inv.tax;
  const tax=taxOn?Math.round(sub*num(st.taxRate))/100:0;
  return {fee,travel:tr,extras,sub,taxOn,tax,total:sub+tax};
}
function jobTotal(job){return totals(job).total;}

function backupText(){
  const copy=JSON.parse(JSON.stringify(APP));
  delete copy.adding;delete copy.draft;delete copy.editing;delete copy.confirmDel;
  if(!APP.bkPhotos)copy.jobs.forEach(j=>Object.values(j.results).forEach(r=>{r.photos=[]}));
  // Letters, digits, - and _ only, so Notes, email and texts can't scramble it.
  const bytes=new TextEncoder().encode(JSON.stringify(copy));
  let bin="";for(let k=0;k<bytes.length;k+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(k,k+8192));
  return "HONESTECH-PPI-BACKUP-V2-"+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function parseBackup(txt){
  txt=String(txt||"");
  const valid=o=>o&&Array.isArray(o.jobs)&&o.settings?o:null;
  const m=txt.match(/HONESTECH-PPI-BACKUP/i);
  if(!m)return null;
  let rest=txt.slice(m.index+m[0].length);
  // New format: base64url after "-V2-"
  const v2=rest.match(/^\s*-\s*V2\s*-/i);
  if(v2){
    try{
      let s=rest.slice(v2[0].length).replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
      while(s.length%4)s+="=";
      const bin=atob(s);const bytes=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)bytes[k]=bin.charCodeAt(k);
      return valid(JSON.parse(new TextDecoder().decode(bytes)));
    }catch(e){return null;}
  }
  // Old format: raw JSON, possibly URL-encoded or with curly quotes from Notes
  for(let pass=0;pass<3&&/%[0-9A-Fa-f]{2}/.test(rest);pass++){
    try{rest=decodeURIComponent(rest.replace(/\+/g," "));}catch(e){break;}
  }
  rest=rest.replace(/[“”„‟″]/g,'"').replace(/[‘’‚‛′]/g,"'");
  const a=rest.indexOf("{"),b=rest.lastIndexOf("}");
  if(a<0||b<a)return null;
  try{return valid(JSON.parse(rest.slice(a,b+1)));}catch(e){return null;}
}

const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==="function");
let CLAUDE_DL=null,CLAUDE_DL_READY=null;
if(IN_CLAUDE)CLAUDE_DL_READY=window.claude.use("downloads").then(d=>(CLAUDE_DL=d)).catch(()=>null);
function webSaveAvailable(){return !IN_CLAUDE&&typeof Blob!=="undefined";}
async function getSaver(){
  if(IN_CLAUDE){const d=CLAUDE_DL||await CLAUDE_DL_READY;return d?{save:(filename,data)=>d.save({filename,data}).then(r=>r.status)}:null;}
  if(!webSaveAvailable())return null;
  return {save:async(filename,data)=>{
    const type=/\.pdf$/i.test(filename)?"application/pdf":"text/plain";
    const blob=data instanceof Blob?data:new Blob([data],{type});
    let file=null;try{file=new File([blob],filename,{type:blob.type||type});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return "saved";}
      catch(e){if(e&&e.name==="AbortError")throw {code:"declined"};}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);return "saved";
  }};
}

/* Full-size photos and videos live in IndexedDB (lots of room); the job keeps small previews. */
const MDB={_p:null,
  open(){return this._p||(this._p=new Promise((res,rej)=>{const r=indexedDB.open("honestech-ppi-media",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("m");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("m",mode);const st=t.objectStore("m");const out=fn(st);
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(id,v){return this.tx("readwrite",st=>st.put(v,id));},
  get(id){return this.tx("readonly",st=>st.get(id));},
  del(id){return this.tx("readwrite",st=>st.delete(id));}
};
const MEDIA_FILE={},MEDIA_URL={},MEDIA_OBJ={};   // id -> File (for sharing), dataURL (photos, for PDF), objectURL (viewing)
let MEDIA_DEL=null;
const MTAGS=[["before","Before"],["after","After"],["finding","Finding"]];
const extOf=m=>/png/.test(m)?"png":/jpe?g/.test(m)?"jpg":/quicktime/.test(m)?"mov":/mp4/.test(m)?"mp4":/webm/.test(m)?"webm":/video/.test(m)?"mov":"jpg";
const fmtDur=s=>s?`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`:"";
function readAsDataURL(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(blob);});}
function imgFromBlob(blob){return new Promise(r=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{r(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=()=>{r(null);URL.revokeObjectURL(u)};im.src=u;});}
function drawTo(src,w0,h0,max,q){const sc=Math.min(1,max/Math.max(w0,h0));const c=document.createElement("canvas");c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);return c;}
function canvasBlob(c,q){return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",q));}
function videoThumb(file){return new Promise(res=>{const u=URL.createObjectURL(file),v=document.createElement("video");let done=false;
  const fin=x=>{if(done)return;done=true;URL.revokeObjectURL(u);res(x);};
  v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";v.src=u;
  v.onloadedmetadata=()=>{const dur=isFinite(v.duration)?v.duration:0;try{v.currentTime=Math.min(0.5,dur/2||0);}catch(e){}
    v.onseeked=()=>{try{const c=drawTo(v,v.videoWidth||320,v.videoHeight||240,320);fin({thumb:c.toDataURL("image/jpeg",0.7),dur});}catch(e){fin({thumb:"",dur});}};};
  v.onerror=()=>fin({thumb:"",dur:0});setTimeout(()=>fin({thumb:"",dur:0}),6000);});}
async function addMediaFiles(job,files,kind){
  job.media=job.media||[];let n=0,fail=0;
  for(const f of files){
    const id="m_"+uid(),tag=job.media.some(m=>m.tag==="before")?"after":"before";
    try{
      if(kind==="photo"){
        const im=await imgFromBlob(f);if(!im){fail++;continue;}
        const full=await canvasBlob(drawTo(im,im.naturalWidth,im.naturalHeight,1600),0.8);
        const thumb=drawTo(im,im.naturalWidth,im.naturalHeight,320).toDataURL("image/jpeg",0.7);
        await MDB.put(id,{buf:await full.arrayBuffer(),type:"image/jpeg"});
        job.media.push({id,kind,tag,cap:"",thumb,mime:"image/jpeg",size:full.size,at:Date.now()});
      }else{
        toast(`Saving video${files.length>1?` ${n+1} of ${files.length}`:""}…`);
        const {thumb,dur}=await videoThumb(f);
        await MDB.put(id,{buf:await f.arrayBuffer(),type:f.type||"video/quicktime"});
        job.media.push({id,kind,tag,cap:"",thumb,mime:f.type||"video/quicktime",size:f.size,dur,at:Date.now()});
      }
      n++;
    }catch(e){console.error(e);fail++;}
  }
  save();
  return {n,fail};
}
async function preloadMedia(job){
  const list=(job&&job.media)||[];let i=0;
  for(const m of list){i++;
    if(MEDIA_FILE[m.id])continue;
    try{const rec=await MDB.get(m.id);if(!rec)continue;
      const name=`${(job.info.customer||"job").replace(/[^A-Za-z0-9]+/g,"-")}-${m.tag}-${i}.${extOf(rec.type)}`;
      const blob=new Blob([rec.buf],{type:rec.type});MEDIA_FILE[m.id]=new File([blob],name,{type:rec.type});
      if(m.kind==="photo")MEDIA_URL[m.id]=await readAsDataURL(blob);
    }catch(e){console.error(e);}
  }
}
async function deleteJobMedia(job){for(const m of (job&&job.media)||[]){try{await MDB.del(m.id);}catch(e){} delete MEDIA_FILE[m.id];delete MEDIA_URL[m.id];}}

async function openViewer(id){
  const m=(S.media||[]).find(x=>x.id===id);if(!m)return;

async function savePdf(kind){
  if(!window.jspdf){toast("The PDF tool didn't load. Check your connection and try again.");return;}
  const dl=await getSaver();
  if(!dl){toast("Saving PDFs isn't available in this view.");return;}
  if(!APP.settings.biz.trim()){toast("Add your business name in Settings first. It goes at the top of the PDF.");return;}
  const i=S.info,slug=s=>String(s||"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
  let blob,filename;
  try{
    if(kind==="report"){blob=buildReportPdf(S);filename=`PPI-${slug(vehOf(i))||"Report"}-${i.date||TODAY}.pdf`;}
    else{blob=buildInvoicePdf(S);save();filename=`Invoice-${slug(S.invoice.num)}${i.customer?"-"+slug(i.customer):""}.pdf`;}
  }catch(e){console.error(e);toast("Couldn't build the PDF.");return;}
  try{const st=await dl.save(filename,blob);if(st==="saved")toast("PDF ready");}
  catch(e){
    if(e&&e.code==="declined")return;
    if(e&&e.code==="rate_limited"){toast("A save is already open. Finish that one first.");return;}
    toast("Couldn't save the PDF here.");
  }
}

  render();window.scrollTo(0,0);setTimeout(()=>{const el=document.getElementById("d-customer");el&&el.focus()},50);
}
function saveDraft(){
  const d=APP.draft;
  if(!d.customer.trim()){toast("Add the customer's name");document.getElementById("d-customer")?.focus();return;}
  const {type,...info}=d;
  if(APP.editing){const j=APP.jobs.find(x=>x.id===APP.editing);Object.assign(j.info,info);
    if((j.type||"ppi")!==type){j.type=type;if(!j.invoice.lines)j.invoice.lines=[];if(type==="service"&&!j.invoice.num)j.invoice.fee=0;if(type==="ppi"&&!j.invoice.num)j.invoice.fee=null;}}
  else{APP.jobs.push(newJob(info,type));
    if(APP.fuFrom){const fj=APP.jobs.find(x=>x.id===APP.fuFrom);if(fj&&fj.followup)fj.followup.status="done";}}
  APP.fuFrom=null;
  APP.adding=false;APP.editing=null;APP.draft=null;APP.day="";save();render();toast("Job saved");
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.nav){APP.view=d.nav;APP.adding=false;save();render();window.scrollTo(0,0);return;}
  if(d.day!==undefined){APP.day=d.day;render();return;}
  if(d.open){const j=APP.jobs.find(x=>x.id===d.open);openJob(d.open,j.status==="done"?STAGES.findIndex(s=>s.id==="report"):null);return;}
  if(d.openinv){openJob(d.openinv,STAGES.length-1);return;}
  if(d.confirm){copyText(confirmText(APP.jobs.find(x=>x.id===d.confirm)),"jobCopy");return;}
  if(d.edit){startAdd(APP.jobs.find(x=>x.id===d.edit));return;}
  if(d.askdel){APP.confirmDel=d.askdel;render();return;}
  if(d.del){deleteJobMedia(APP.jobs.find(x=>x.id===d.del));APP.jobs=APP.jobs.filter(x=>x.id!==d.del);if(APP.active===d.del)APP.active=null;APP.confirmDel=null;save();render();toast("Job deleted");return;}
  if(d.act==="nodel"){APP.confirmDel=null;render();return;}
  if(d.act==="cancelAdd"){APP.fuFrom=null;APP.adding=false;APP.editing=null;render();return;}
  if(d.act==="fresh"){APP=blankApp();rebuildChecklist(APP.settings);save();render();window.scrollTo(0,0);toast("Add your business info to get started");return;}
  if(d.ckadd){const lbl=addCustomItem(d.ckadd,d.pfx);if(lbl){OPEN_CK.add(d.ckadd);if(d.pfx==="sk")OPEN_ADD=null;render();toast(`Added "${lbl}"`);}return;}
  if(d.ckhide){const st=APP.settings;const h=new Set(st.hidden||[]);h.has(d.ckhide)?h.delete(d.ckhide):h.add(d.ckhide);st.hidden=[...h];rebuildChecklist(st);save();render();return;}
  if(d.ckrm){const c=(APP.settings.custom||[]).find(x=>x.id===d.ckrm);if(c){c.removed=true;rebuildChecklist(APP.settings);save();render();toast(`Removed "${c.label}"`);}return;}
  if(d.act==="ckshowall"){APP.settings.hidden=[];rebuildChecklist(APP.settings);save();render();toast("All built-in items shown");return;}
  if(d.openadd){OPEN_ADD=d.openadd;render();setTimeout(()=>document.getElementById(`sk-n-${d.openadd}`)?.focus(),30);return;}
  if(d.closeadd){OPEN_ADD=null;render();return;}
  if(d.act==="rmlogo"){delete APP.settings.logo;delete APP.settings.logoW;delete APP.settings.logoH;save();render();toast("Logo removed");return;}
  if(d.act==="gobackup"){APP.view="settings";render();document.getElementById("backup")?.scrollIntoView({block:"start"});return;}
  if(d.act==="pickRestore"){$("#restoreFile").click();return;}
  if(d.act==="backupFile"){saveBackupFile();return;}
  if(d.act==="backup"){const txt=backupText();const box=$("#bkbox");
    const done=()=>{APP.lastBackup=TODAY;save();toast("Backup copied. Paste it into Notes or an email.");};
    const fallback=()=>{box.value=txt;box.hidden=false;box.focus();box.select();APP.lastBackup=TODAY;save();toast("Backup selected. Use your phone's Copy.");};
    try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(err){fallback();}
    return;}
  if(d.act==="askRestore"){const o=parseBackup($("#restoreIn").value);
    if(!o){toast("Couldn't read that backup. Make sure you pasted all of it, starting with HONESTECH-PPI-BACKUP.");return;}
    $("#restoreActs").innerHTML=`<div class="confirm" style="width:100%"><span>Replace everything on this phone with this backup (${o.jobs.length} job${o.jobs.length===1?"":"s"}, ${esc(o.settings.biz||"no business name")})?</span><button class="btn danger" type="button" data-act="doRestore">Replace with backup</button><button class="btn" type="button" data-act="cancelRestore">Cancel</button></div>`;return;}
  if(d.act==="cancelRestore"){$("#restoreActs").innerHTML=`<button class="btn" type="button" data-act="askRestore">Restore</button>`;return;}
  if(d.act==="doRestore"){const o=parseBackup($("#restoreIn").value);if(!o)return;
    APP={...o,view:"jobs",adding:false,draft:null,editing:null,confirmDel:null,sample:false,lastBackup:o.lastBackup||TODAY};rebuildChecklist(APP.settings);save();render();window.scrollTo(0,0);toast(`Restored ${o.jobs.length} job${o.jobs.length===1?"":"s"}`);return;}
  if(d.go!==undefined)return go(+d.go);
  if(d.rate){const id=t.closest("[data-item]").dataset.item;const r=res(id);r.r=r.r===d.rate?"":d.rate;r.auto=false;
    if(r.r==="bad"&&!r.note)r.open=true;
    t.closest(".item").outerHTML=renderItem(ALL_ITEMS.find(x=>x.id===id));if(S.status==="sched")S.status="active";save();renderChrome();
    if(r.open&&!r.note){const n=document.getElementById("n-"+id);n&&n.focus();}
    return;}
  if(d.addnote){const id=d.addnote;res(id).open=true;t.closest(".item").outerHTML=renderItem(ALL_ITEMS.find(x=>x.id===id));document.getElementById("n-"+id).focus();return;}
  if(d.delphoto){const [id,k]=d.delphoto.split(":");res(id).photos.splice(+k,1);save();t.closest(".item").outerHTML=renderItem(ALL_ITEMS.find(x=>x.id===id));return;}
  if(d.verdict){S.verdict=d.verdict;save();render();return;}
  if(d.act==="pdfReport"){savePdf("report");return;}
  if(d.act==="pdfInvoice"){savePdf("invoice");return;}
  if(d.act==="copyReport"){copyText(reportText(),"copybox");return;}
  if(d.act==="copyInvoice"){copyText(invoiceText(),"invbox");return;}
  if(d.act==="copyBoth"){copyText(reportText()+"\n\n————————————\n\n"+invoiceText(),"invbox");return;}
  if(d.pick){document.getElementById(d.pick)?.click();return;}
  if(d.act==="mshare"){shareMedia();return;}
  if(d.mview){openViewer(d.mview);return;}
  if(d.mtag){const m=S.media.find(x=>x.id===d.mtag);const k=MTAGS.findIndex(([v])=>v===m.tag);m.tag=MTAGS[(k+1)%MTAGS.length][0];save();t.className=`mtag t-${m.tag}`;t.textContent=MTAGS[(k+1)%MTAGS.length][1];return;}
  if(d.mdel){if(MEDIA_DEL!==d.mdel){MEDIA_DEL=d.mdel;const y=window.scrollY;render();window.scrollTo(0,y);setTimeout(()=>{if(MEDIA_DEL===d.mdel){MEDIA_DEL=null;}},4000);return;}
    const id=d.mdel;S.media=S.media.filter(x=>x.id!==id);MDB.del(id).catch(()=>{});delete MEDIA_FILE[id];delete MEDIA_URL[id];MEDIA_DEL=null;save();const y=window.scrollY;render();window.scrollTo(0,y);toast("Deleted");return;}
  if(d.jobcal){const j=APP.jobs.find(x=>x.id===d.jobcal);openIcs(`job-${(j.info.customer||"job").replace(/[^A-Za-z0-9]+/g,"-")}.ics`,jobIcs(j));return;}
  if(d.fucal){const j=APP.jobs.find(x=>x.id===d.fucal);openIcs(`reminder-${(j.info.customer||"customer").replace(/[^A-Za-z0-9]+/g,"-")}.ics`,fuIcs(j));return;}
  if(d.fumonths){const f=S.followup||(S.followup={what:"",date:"",miles:"",status:"open"});
    const base=S.info.date||TODAY,dt=new Date(base+"T12:00:00");dt.setMonth(dt.getMonth()+ +d.fumonths);f.date=isoDay(dt);f.status="open";
    if(!f.what)f.what=/brake/i.test(S.info.work||"")?"Brake inspection":/oil/i.test(S.info.work||"")?"Oil change":"Service check";
    save();const y=window.scrollY;render();window.scrollTo(0,y);refreshTotals();return;}
  if(d.act==="fuclear"){S.followup=null;save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(d.futext){copyText(fuText(APP.jobs.find(x=>x.id===d.futext)),"jobCopy");return;}
  if(d.fudone){const j=APP.jobs.find(x=>x.id===d.fudone);j.followup.status="done";save();render();toast("Reminder cleared");return;}
  if(d.fubook){const j=APP.jobs.find(x=>x.id===d.fubook),i=j.info;
    startAdd(null);Object.assign(APP.draft,{type:"service",work:j.followup.what||"",customer:i.customer,phone:i.phone,location:i.location,dist:i.dist,year:i.year,make:i.make,model:i.model,trim:i.trim});
    APP.fuFrom=j.id;render();window.scrollTo(0,0);return;}
  if(d.act==="fuall"){APP.showAllFu=!APP.showAllFu;render();return;}
  if(d.jtype){APP.draft.type=d.jtype;render();return;}
  if(d.addline){const ls=S.invoice.lines||(S.invoice.lines=[]);ls.push({k:d.addline,d:"",q:d.addline==="labor"?"1":"1",p:d.addline==="labor"?(APP.settings.laborRate||""):""});save();render();
    const k=ls.length-1;document.getElementById("ln-d-"+k)?.focus();return;}
  if(d.delline!==undefined){S.invoice.lines.splice(+d.delline,1);save();render();return;}
  if(d.act==="additem"){S.invoice.items.push({d:"",a:""});save();render();const k=S.invoice.items.length-1;document.getElementById("it-d-"+k)?.focus();return;}
  if(d.delitem!==undefined){S.invoice.items.splice(+d.delitem,1);save();render();return;}
  if(d.paid!==undefined){const inv=S.invoice;if(!d.paid||(inv.paid&&inv.paidVia===d.paid)){inv.paid=false;inv.paidVia="";inv.paidDate="";}else{inv.paid=true;inv.paidVia=d.paid;inv.paidDate=TODAY;}save();render();toast(inv.paid?`Marked paid by ${inv.paidVia}`:"Marked unpaid");return;}
});
$("#prevBtn").addEventListener("click",()=>{if(APP.view==="job"&&!isSvc(S))go(S.step-1);});
$("#nextBtn").addEventListener("click",()=>{
  if(APP.view==="jobs"){ if(APP.adding)saveDraft(); else startAdd(); return; }
  if(isSvc(S)||STAGES[S.step].id==="invoice"){if(isSvc(S)&&S.status==="done"){APP.view="jobs";save();render();window.scrollTo(0,0);return;}S.status="done";APP.view="jobs";save();render();window.scrollTo(0,0);toast(S.invoice.paid?"Job complete":"Job complete. Invoice is unpaid.");return;}
  go(S.step+1);
});
document.addEventListener("toggle",e=>{const el=e.target;if(el&&el.dataset&&el.dataset.ck){el.open?OPEN_CK.add(el.dataset.ck):OPEN_CK.delete(el.dataset.ck);}},true);
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="jobForm")saveDraft();});
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(d.draft){APP.draft[d.draft]=t.value;
    if(d.draft==="dist"){const tr=Math.round(Math.max(0,num(t.value)-num(APP.settings.freeMiles))*num(APP.settings.perMile));const est=document.getElementById("d-est");
      if(est){if(APP.draft.type==="service")est.value=money(tr);else{est.value=money(num(APP.settings.fee)+tr);est.nextElementSibling.textContent=`${money(APP.settings.fee)} PPI${tr?` + ${money(tr)} travel`:""}`;}}}
    return;}
  if(d.set){APP.settings[d.set]=t.value;save();return;}
  if(d.info){S.info[d.info]=d.info==="vin"?t.value.toUpperCase():t.value;
    if(d.info==="location"){const a=document.getElementById("dirLink");if(a){a.href=mapsHref(t.value);a.hidden=!t.value.trim();}}
    if(d.info==="vin"){const vc=vinCheck(t.value);const m=$("#vinMsg");m.className="vinmsg "+vc.cls;m.textContent=vc.msg;}
    if(d.info==="dist")refreshTotals();
    save();return;}
  if(d.inv){S.invoice[d.inv]=t.value;save();refreshTotals();return;}
  if(d.fu){const f=S.followup||(S.followup={what:"",date:"",miles:"",status:"open"});f[d.fu]=t.value;f.status="open";save();
    if(d.fu==="date"){const y=window.scrollY;render();window.scrollTo(0,y);}return;}
  if(d.mcap){const m=(S.media||[]).find(x=>x.id===d.mcap);if(m){m.cap=t.value;save();}return;}
  if(d.lnd!==undefined){S.invoice.lines[+d.lnd].d=t.value;save();return;}
  if(d.lnq!==undefined||d.lnp!==undefined){const k=+(d.lnq??d.lnp),x=S.invoice.lines[k];if(d.lnq!==undefined)x.q=t.value;else x.p=t.value;
    const a=document.getElementById("ln-a-"+k);if(a)a.textContent=money(lineAmt(x));save();refreshTotals();return;}
  if(d.itd!==undefined){S.invoice.items[+d.itd].d=t.value;save();return;}
  if(d.ita!==undefined){S.invoice.items[+d.ita].a=t.value;save();refreshTotals();return;}
  if(d.note){res(d.note).note=t.value;save();return;}
  if(d.val){res(d.val).val=t.value;save();return;}
  if(d.corner){
    const [id,k]=d.corner.split(":");const it=ALL_ITEMS.find(x=>x.id===id);const r=res(id);const v=cornerVals(r);v[k]=t.value;
    t.closest(".corner").dataset.cr=cornerRate(it.corners,t.value);
    if(!r.r||r.auto){
      const rs=CORNERS.map(([c])=>cornerRate(it.corners,v[c])).filter(Boolean);
      r.r=rs.includes("bad")?"bad":rs.includes("mon")?"mon":rs.length?"good":"";r.auto=true;
      const el=t.closest(".item");el.dataset.r=r.r;el.querySelectorAll("[data-rate]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.rate===r.r)));
    }
    if(S.status==="sched")S.status="active";
    save();renderChrome();
  }
});
function refreshTotals(){const box=$("#totals");if(!box)return;const t=totals(S);box.innerHTML=totalsHTML(t);const tr=$("#inv-travel");if(tr)tr.placeholder=t.travel.auto?String(t.travel.fee):"";}
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.setc){APP.settings[d.setc]=t.checked;save();return;}
  if(d.restorefile){const f=t.files&&t.files[0];if(!f)return;
    const fr=new FileReader();fr.onload=()=>{const o=parseBackup(String(fr.result||""));t.value="";
      if(!o){toast("That file isn't a Honestech app backup.");return;}
      $("#restoreIn").value=String(fr.result);
      $("#restoreActs").innerHTML=`<div class="confirm" style="width:100%"><span>Replace everything on this phone with <strong>${esc(f.name)}</strong> (${o.jobs.length} job${o.jobs.length===1?"":"s"}, ${esc(o.settings.biz||"no business name")})?</span><button class="btn danger" type="button" data-act="doRestore">Replace with backup</button><button class="btn" type="button" data-act="cancelRestore">Cancel</button></div>`;
      $("#restoreActs").scrollIntoView({block:"center"});};
    fr.onerror=()=>toast("Couldn't open that file.");fr.readAsText(f);return;}
  if(d.logo){const f=t.files&&t.files[0];if(!f)return;
    loadLogo(f).then(r=>{if(!r){toast("Couldn't read that image. Try a PNG or JPG.");return;}
      Object.assign(APP.settings,r);save();render();toast("Logo saved");});return;}
  if(d.bkphotos){APP.bkPhotos=t.checked;save();return;}
  if(d.invc){S.invoice[d.invc]=t.checked;save();refreshTotals();return;}
  if(d.lnk!==undefined){const k=+d.lnk,x=S.invoice.lines[k];x.k=t.value;if(x.k==="labor"&&!x.p&&APP.settings.laborRate)x.p=APP.settings.laborRate;save();render();refreshTotals();return;}
  if(d.set&&APP.view==="settings"){render();return;}
  if(d.media){const files=[...t.files];t.value="";if(!files.length)return;const job=S;
    addMediaFiles(job,files,d.media).then(({n,fail})=>{if(S===job){const y=window.scrollY;render();window.scrollTo(0,y);}
      toast(fail?`Saved ${n}, ${fail} couldn't be saved (phone storage may be full)`:`${n} ${d.media==="video"?"video":"photo"}${n===1?"":"s"} added`);});return;}
  if(!d.photo)return;const id=d.photo;
  const files=[...t.files];if(!files.length)return;
  Promise.all(files.map(shrink)).then(urls=>{res(id).photos.push(...urls.filter(Boolean));save();
    const el=document.querySelector(`[data-item="${id}"]`);if(el)el.outerHTML=renderItem(ALL_ITEMS.find(x=>x.id===id));toast(urls.length>1?`${urls.length} photos added`:"Photo added");});
});
function loadLogo(file){
  return new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,600/img.width,300/img.height);const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
    g.fillStyle="#ffffff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    resolve({logo:c.toDataURL("image/jpeg",0.9),logoW:w,logoH:h});};img.onerror=()=>resolve(null);img.src=fr.result;};fr.onerror=()=>resolve(null);fr.readAsDataURL(file);});
}
function shrink(file){
  return new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const max=900,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",0.6));};img.onerror=()=>resolve(null);img.src=fr.result;};fr.onerror=()=>resolve(null);fr.readAsDataURL(file);});
}
