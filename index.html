#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 42%,#1c2d44 0%,#0b1118 68%);transition:opacity .38s ease,transform .38s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .sp-mk{width:min(34vw,170px);height:min(34vw,170px);filter:drop-shadow(0 18px 34px rgba(0,0,0,.55));animation:spIn .55s cubic-bezier(.2,.9,.3,1.2) both}
#splash .sp-mk svg{width:100%;height:100%;display:block}
#splash .sp-wr{animation:spWr .7s .15s cubic-bezier(.3,1.4,.5,1) both;transform-origin:512px 522px}
#splash .sp-w{font-family:HSplashB,"Barlow Condensed",system-ui,sans-serif;font-weight:900;font-size:min(12vw,58px);line-height:1;letter-spacing:.01em;animation:spUp .5s .25s ease-out both}
#splash .sp-s{font-family:HSplashS,system-ui,sans-serif;font-weight:600;font-size:min(3.6vw,16px);letter-spacing:.32em;padding-left:.32em;color:#c9d3df;margin-top:12px;text-align:center;animation:spUp .5s .38s ease-out both}
#splash .sp-bar{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#splash .sp-bar i{display:block;width:40%;height:100%;border-radius:2px;background:linear-gradient(90deg,#ffa31a,#3b96ff);animation:spBar 1s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes spWr{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.has-bgimg{background:var(--bg)}
html.has-bgimg body{background:transparent}
#bgLayer{position:fixed;inset:-12px;z-index:-2;background-position:center;background-size:cover;background-repeat:no-repeat;pointer-events:none;display:none}
#bgShade{position:fixed;inset:0;z-index:-1;background:var(--bg);pointer-events:none;display:none}
html.has-bgimg #bgLayer,html.has-bgimg #bgShade{display:block}
.bgimg-row{display:flex;gap:12px;align-items:center}
.bgimg-prev{flex:0 0 72px;height:96px;border-radius:10px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.bgimg-acts{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.bgimg-acts input[type=range]{width:100%}
.form .bgimg-acts label{text-transform:none;letter-spacing:0;font-size:13px}.form .bgimg-acts label.mini{font-size:13px;color:#fff;display:inline-flex}.form .bgimg-acts label.check{flex-direction:row;color:var(--ink);font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:760px;margin:0 auto;padding:10px 16px 0;position:relative}
.saved{flex:0 0 auto;align-self:center;font-size:11px;color:var(--muted);opacity:.85;transition:color .3s}
.saved.flash{color:var(--good)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-brand);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand{align-items:center}
.brand h1{flex:1;min-width:0}
.brand h1 .b2{color:var(--accent);white-space:nowrap}
.brand h1 small{font-size:.6em;letter-spacing:.12em;margin-left:2px;color:var(--muted);vertical-align:middle}
.brand-r{flex:0 0 auto}
.brand h1.has-logo{display:flex;align-items:center;gap:10px}
.brand-logo{width:40px;height:40px;object-fit:contain;border-radius:9px;background:#fff;padding:2px;flex:0 0 auto;border:1px solid var(--line)}
.brand-txt{min-width:0;display:block}
.brand h1 .b1,.brand h1 .b2{overflow:hidden;text-overflow:ellipsis}
.brand-txt .b2{white-space:nowrap}
.brand h1.long{font-size:15px!important;line-height:1.1}
@media (max-width:560px){.brand h1{font-size:18px;line-height:1.05}.brand h1 .b1,.brand h1 .b2{display:block;white-space:nowrap}}

.brand .veh{font-size:13px;color:var(--muted);text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.steps[hidden],#jobChrome .bar[hidden]{display:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 6px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--na-soft);font-family:var(--f-mono);font-size:11px;color:var(--ink)}
.step.done b{background:var(--good);color:var(--surface)}
.step.flag b{background:var(--bad);color:var(--surface)}
.step.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.sample{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--mon-soft);border:1px solid var(--mon);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.stage-head{margin:4px 0 14px}
.eyebrow{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.stage-head h2{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:2px 0 6px;text-wrap:balance}
.when{color:var(--muted);max-width:62ch;margin:0}
.when strong{color:var(--ink)}

.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px}
.item[data-r="good"]{border-left-color:var(--good)}
.item[data-r="mon"]{border-left-color:var(--mon)}
.item[data-r="bad"]{border-left-color:var(--bad)}
.item[data-r="na"]{border-left-color:var(--na)}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-label{font-weight:600;min-width:0}
.item-hint{color:var(--muted);font-size:13px;margin-top:2px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;font-weight:600;font-size:14px;min-height:44px}
.rate button[aria-pressed="true"][data-v="good"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.rate button[aria-pressed="true"][data-v="mon"]{background:var(--mon-soft);border-color:var(--mon);color:var(--mon)}
.rate button[aria-pressed="true"][data-v="bad"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.rate button[aria-pressed="true"][data-v="na"]{background:var(--na-soft);border-color:var(--na);color:var(--na)}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.meas{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.meas input{width:72px;border:0;background:transparent;padding:8px 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.meas span{font-size:13px;color:var(--muted);white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.mini input[type=file]{display:none}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:12px}
.axle{grid-column:1/-1;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.corner{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);min-width:0}
.corner[data-cr="good"]{border-left-color:var(--good)} .corner[data-cr="mon"]{border-left-color:var(--mon)} .corner[data-cr="bad"]{border-left-color:var(--bad);background:var(--bad-soft)}
.cname{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);width:22px}
.corner input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:11px 0;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.cunit{font-size:12px;color:var(--muted)}
.note{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px;resize:vertical}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs figure{margin:0;position:relative;width:72px;height:72px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:13px;line-height:1}

.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);width:100%}
.form input.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.vinmsg{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0}
.vinmsg.ok{color:var(--good)} .vinmsg.err{color:var(--bad)}
.subh{font-family:var(--f-display);font-size:22px;font-weight:700;margin:6px 0 10px}

/* estimate & invoice: flat sections with dividers instead of boxes inside boxes */
.svc-doc .lines{border-top:1px solid var(--line);margin-top:6px}
.svc-doc .ln{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0}
.svc-doc .ln input,.svc-doc .ln select{background:var(--bg);border-color:transparent;border-radius:8px}
.svc-doc .travel-ln{margin-top:14px;border-top:1px solid var(--line)}
.svc-doc .mini[data-addline]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.svc-doc label.mini{border:0;background:transparent;padding-left:0}
.svc-doc .cost-box{border-style:solid;background:transparent}
.dash-card .tl,.tile .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.more{position:relative;display:inline-block}
details.more>summary{list-style:none;cursor:pointer;letter-spacing:.08em;font-weight:700;min-width:44px;text-align:center}
details.more>summary::-webkit-details-marker{display:none}
.more-menu{position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px -12px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column}
@media (max-width:640px){
  details.more[open]>summary::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29;cursor:default}
  .more-menu{position:fixed;left:10px;right:10px;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));min-width:0;border-radius:18px;padding:8px;animation:sheetUp .18s ease-out}
  .more-it{padding:14px 14px;font-size:16px}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.more-it{display:flex;align-items:center;gap:2px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);text-decoration:none;font-weight:500}
.more-it:hover,.more-it:active{background:var(--bg)}
.more-it.del{color:var(--bad)}
.more-it svg.uic{color:var(--muted)}.more-it.del svg.uic{color:var(--bad)}
svg.uic{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.35em;flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:11;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar[hidden]{display:none}
.tabbar-in{max-width:620px;margin:0 auto;display:flex;justify-content:space-around}
.tabbtn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0!important;background:transparent!important;padding:4px 2px!important;color:var(--muted);font-size:11px!important;font-weight:600;border-radius:10px;-webkit-tap-highlight-color:transparent}
.tabbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar .tabbtn[aria-current="page"]{color:var(--accent);background:transparent!important}
@media (max-width:560px){.brand .saved{display:none}}
.tabbtn[aria-current="page"] svg{stroke-width:2.3}
.tabbtn:active{transform:scale(.94)}
nav.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.foot-inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.foot .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.rep-head h3{font-family:var(--f-display);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.rep-head .biz{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:14px 0}
.kv div{min-width:0}
.kv dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--f-mono);font-weight:500}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tally div{border-radius:8px;padding:10px;text-align:center}
.tally strong{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-size:12px}
.t-good{background:var(--good-soft);color:var(--good)} .t-mon{background:var(--mon-soft);color:var(--mon)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-open{background:var(--na-soft);color:var(--na)}
.verdict{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.verdict .opts{display:flex;flex-wrap:wrap;gap:6px}
.verdict button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px}
.verdict button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rep-sec{margin-top:18px}
.rep-sec h4{font-family:var(--f-display);font-size:20px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em}
.rep-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rep-list li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.rep-list li:last-child{border-bottom:0}
.pill{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;min-width:64px;text-align:center}
.p-good{background:var(--good-soft);color:var(--good)} .p-mon{background:var(--mon-soft);color:var(--mon)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-na{background:var(--na-soft);color:var(--na)}
.rep-list .txt{min-width:0}
.rep-list .txt small{display:block;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.copyrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;pointer-events:none}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
textarea.copybox{width:100%;min-height:160px;margin-top:10px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px}
@media (max-width:480px){
  .form{grid-template-columns:minmax(0,1fr)}
  .stage-head h2{font-size:28px}
  .tally strong{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* app shell: schedule, settings, invoice */
.brand-r{display:flex;gap:6px;align-items:center;min-width:0}
.navbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.jobbar{display:flex;align-items:center;gap:8px;padding:8px 0 0;min-width:0}
.jobbar .veh{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;margin:0 -2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day strong{font-family:var(--f-display);font-size:22px;line-height:1}
.day i{width:6px;height:6px;border-radius:50%;background:transparent;font-style:normal}
.day.has i{background:var(--accent)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day.all{width:auto;padding:6px 12px;justify-content:center}
.group-h{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.jobs{display:flex;flex-direction:column;gap:10px}
#main.view-in{animation:viewIn .18s ease-out}
@keyframes viewIn{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#main.view-in{animation:none}}
.job.js-booked{box-shadow:inset 4px 0 0 var(--accent)}.job.js-active{box-shadow:inset 4px 0 0 var(--good)}.job.js-hold,.job.js-done{box-shadow:inset 4px 0 0 var(--mon)}
.job.js-paid{box-shadow:inset 4px 0 0 var(--line)}.job.js-cancel{box-shadow:inset 4px 0 0 var(--bad);opacity:.85}
.job.pend{box-shadow:inset 4px 0 0 #8b5cf6}
.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px}
.job .when-col{grid-row:span 3;border-right:1px solid var(--line);padding-right:10px}
.job .t{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.job .d{font-size:12px;color:var(--muted)}
.job .who{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.job .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.job .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.st-sched{background:var(--accent-soft);color:var(--accent)} .st-active{background:var(--mon-soft);color:var(--mon)} .st-done{background:var(--na-soft);color:var(--na)} .st-paid{background:var(--good-soft);color:var(--good)} .st-unpaid{background:var(--bad-soft);color:var(--bad)}
.mini.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini.del{color:var(--bad)}
.skel{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line) 0%,var(--bg) 50%,var(--line) 100%);background-size:200% 100%;animation:skel 1.2s ease-in-out infinite;margin:6px 0}
.skel-wrap{display:flex;flex-direction:column}.skel-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}.skel-row .skel{margin:0}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.rep-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}.rep-row.muted span{color:var(--muted)}
.rep-profit{display:flex;justify-content:space-between;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.rep-tbl{display:flex;flex-direction:column;font-size:13.5px;font-variant-numeric:tabular-nums}.rep-tr{display:grid;grid-template-columns:1fr 1.1fr 1.2fr 1fr 1.1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}.rep-tr span:not(:first-child){text-align:right}
.rep-th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.rep-tr.zero{color:var(--muted)}
.rep-dl{display:flex;flex-direction:column;gap:8px}
.more-jobs{display:block;width:100%;margin:8px 0 4px}

async function nativeShareFiles(files,text){const FS=capPlugin("Filesystem"),SH=capPlugin("Share");if(!FS||!SH)throw {msg:"Sharing isn't available"};
  const uris=[];let k=0;
  for(const f of files){const name=String(f.name||"file").replace(/[^\w.\-]+/g,"_").slice(-80)||"file";
    const r=await FS.writeFile({path:`share/${Date.now()}-${k++}/${name}`,data:await blobB64(f),directory:"CACHE",recursive:true});uris.push(r.uri);}

he app show on Home so you can delete them.":"Las facturas pagadas entran como pagadas. Los duplicados de trabajos que ya están en la app salen en Inicio para que los borres.","Photos, videos and receipt pictures stay on the device that took them for now.":"Las fotos, videos y recibos se quedan por ahora en el aparato que los tomó.","Pick Auto, Light or Dark, an app color, and a background.":"Escoge Auto, Claro u Oscuro, un color de app y un fondo.","Pick Parts, Tools, Supplies, Fuel or Other. Add the amount, store and a receipt photo.":"Escoge Piezas, Herramientas, Insumos, Gasolina u Otro. Agrega el monto, la tienda y una foto del recibo.","Pick Pre-purchase inspection or Service / repair.":"Escoge Inspección precompra o Servicio / reparación.","Pick the files. The app shows what it found before adding anything.":"Escoge los archivos. La app enseña lo que encontró antes de agregar nada.","Save a backup file to iCloud Drive so you never lose your jobs.":"Guarda un archivo de respaldo en iCloud Drive para nunca perder tus trabajos.","Save mileage log (CSV) at tax time.":"Guarda el registro de millaje (CSV) en temporada de impuestos.","Schedule → + Book a job.":"Agenda → + Agendar trabajo.","Schedule → Month.":"Agenda → Mes.","Schedule → 📥 Requests → Paste request → Read it.":"Agenda → 📥 Solicitudes → Pegar solicitud → Leerlo.","Set free travel miles and the rate per mile after that.":"Pon las millas de viaje gratis y la tarifa por milla después.","Set your PPI fee and labor rate per hour.":"Pon tu cobro de PPI y tu tarifa de mano de obra por hora.","Settings → Appearance.":"Ajustes → Apariencia.","Settings → Backup & restore → Save backup file, and save it to iCloud Drive. To move phones, open that file there with Restore.":"Ajustes → Respaldo y restauración → Guardar archivo de respaldo, y guárdalo en iCloud Drive. Para cambiar de teléfono, abre ese archivo ahí con Restaurar.","Settings → Checklist.":"Ajustes → Lista de revisión.","Settings → Cloud sync → View plan let OUT_LANG=UI_LANG;

function withLang(lg,fn){const p=OUT_LANG;OUT_LANG=lg==="es"?"es":"en";try{return fn();}finally{OUT_LANG=p;}}
const NUMRE=/-?\$[\d,]+(?:\.\d+)?|\d+(?:[.,:]\d+)*/g;
const PAT_CACHE=new Map();
function patsOf(D){let ps=PAT_CACHE.get(D);if(ps)return ps;
  ps=Object.keys(D).filter(x=>x.includes("{x}")).sort((a,b)=>b.length-a.length).map(x=>({re:new RegExp("^"+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\\\{x\\\}/g,"(.+?)").replace(/\\\{#\\\}/g,"(-?\\d+(?:[.,:]\\d+)*)").replace(/\\\{\\\$\\\}/g,"(-?\\$[\\d,]+(?:\\.\\d+)?)")+"$"),to:D[x],src:x}));
  PAT_CACHE.set(D,ps);return ps;}
// one string → Spanish, or null when there's nothing to translate
function trIn(t,D){
  if(D[t]!=null)return D[t];
  const toks=[];const k=t.replace(NUMRE,m=>{toks.push(m);return /\$/.test(m)?"{$}":"{#}";});
  if(k!==t&&D[k]!=null){let i=0;return D[k].replace(/\{\$\}|\{#\}/g,()=>toks[i++]??"");}
  for(const p of patsOf(D)){const m=t.match(p.re);if(m){let i=1;return p.to.replace(/\{x\}|\{#\}|\{\$\}/g,()=>{const c=m[i++]||"";return trIn(c.trim(),D)??c;});}}
  return null;}
function trKey(t){const v=trIn(t,ES);if(v!=null)return v;
  if(t.includes(" · ")){const parts=t.split(" · "),tr=parts.map(x=>trIn(x.trim(),ES));if(tr.some(x=>x!=null))return parts.map((x,i)=>tr[i]??x).join(" · ");}
  return null;}
// customer documents: document words first, then the app's words; ALL-CAPS headings keep their caps
function trDoc(s){const t=String(s??"");const n=t.replace(/\s+/g," ").trim();if(!n||!/[A-Za-z]{2}/.test(n))return t;
  const one=x=>trIn(x,ES_DOC)??trIn(x,ES);
  let v=one(n);if(v!=null)return v;
  if(n===n.toUpperCase()&&/[A-Z]{3}/.test(n)){const tc=n.charAt(0)+n.slice(1).toLowerCase();v=one(tc)??one(n.toLowerCase());if(v!=null)return v.toUpperCase();
    v=one(n.split(" ").map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(" "));if(v!=null)return v.toUpperCase();}
  if(n.includes(" · ")){const parts=n.split(" · "),tr=parts.map(x=>one(x.trim()));if(tr.some(x=>x!=null))return parts.map((x,i)=>tr[i]??x).join(" · ");}
  return t;}
const L_=s=>isEs()?trDoc(s):s;
// a whole text document (estimate / invoice text), line by line
function trLines(text){if(!isEs())return text;
  return String(text).split("\n").map(line=>{if(!line.trim())return line;
    const lm=line.match(/^([A-Za-z][A-Za-z #/()&.-]{0,30}):\s(.*)$/);if(lm){const lab=trDoc(lm[1]);if(lab!==lm[1])return `${lab}: ${trDoc(lm[2])}`;}
    const whole=trDoc(line);if(whole!==line)return whole;
    let m=line.match(/^(.+?)(\s{2,}|\s)(-?\$[\d,]+\.\d\d)$/);if(m&&m[1].length>=2){const left=m[1].replace(/\s+$/,""),tl=trDoc(left);if(tl!==left)return tl.padEnd(30," ")+" "+m[3].padStart(10," ");}
    m=line.match(/^([A-Za-z][A-Za-z #/()&.-]{0,30}):\s(.*)$/);if(m){const lab=trDoc(m[1]),val=trDoc(m[2]);return `${lab}: ${val}`;}
    return line;}).join("\n");}

  try{const j=await supa("/auth/v1/token?grant_type=refresh_token",{method:"POST",auth:false,body:{refresh_token:AUTH.refresh_token}});const shop=AUTH.shop_id;setAuth(j);AUTH.shop_id=shop;saveAuth();}
  catch(e){if(e.code==="offline")throw e;AUTH=null;saveAuth();SYNC.state="off";throw {code:"signedout",msg:"Please sign in again"};}
}

function jwtAal(t){try{let p=String(t).split(".")[1].replace(/-/g,"+").replace(/_/g,"/");p+="=".repeat((4-p.length%4)%4);return JSON.parse(atob(p)).aal||"aal1";}catch(e){return "aal1";}}
async function authCall(path,token,{method="GET",body}={}){
  let r;try{r=await fetch(SUPA_URL+path,{method,headers:{"apikey":SUPA_KEY,"Content-Type":"application/json","Authorization":"Bearer "+token},body:body===undefined?undefined:JSON.stringify(body)});}catch(e){throw {code:"offline",msg:"No connection"};}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok){const m=(j&&(j.msg||j.message||j.error_description||j.error))||("Error "+r.status);throw {code:"http",status:r.status,msg:String(m)};}return j;}

async function mfaQrSrc(t){
  try{if(t.uri&&await loadQr()){const q=window.qrcode(0,"M");q.addData(t.uri);q.make();return q.createDataURL(6,4);}}catch(e){}
  let qr=String(t.qr_code||"");const m=/^data:image\/svg\+xml;(?:charset=)?utf-?8,([\s\S]*)$/i.exec(qr);
  if(m){let svg=m[1];try{if(/^%3C/i.test(svg))svg=decodeURIComponent(svg);}catch(e){}qr="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);}
  return qr;}
async function mfaList(token){const u=await authCall("/auth/v1/user",token);return ((u&&u.factors)||[]).filter(f=>(f.factor_type||f.type)==="totp");}
async function mfaVerified(token){return (await mfaList(token)).find(f=>f.status==="verified")||null;}
async function mfaCheck(token,factorId,code){code=String(code||"").replace(/\D/g,"");if(code.length!==6)throw {msg:"Type the 6-digit code from your authenticator app"};
  const ch=await authCall(`/auth/v1/factors/${factorId}/challenge`,token,{method:"POST",body:{}});
  try{return await authCall(`/auth/v1/factors/${factorId}/verify`,token,{method:"POST",body:{challenge_id:ch.id,code}});}
  catch(e){if(e.code==="offline")throw e;throw {msg:"That code didn't work. Check the time on your phone and use the newest code."};}}

async function cloudSignIn(email,pw,create){
  email=String(email||"").trim().toLowerCase();if(!email||!pw)throw {msg:"Enter your email and a password"};
  if(create&&pw.length<6)throw {msg:"Use a password with at least 6 characters"};
  let j;
  if(create){j=await supa("/auth/v1/signup",{method:"POST",auth:false,body:{email,password:pw}});
    if(!j||!j.access_token){if(j&&(j.id||(j.user&&j.user.id)))throw {msg:"Account created. Check your email to confirm it, then sign in. (Or turn off Confirm email in Supabase.)"};throw {msg:"Couldn't create the account"};}}
  else j=await supa("/auth/v1/token?grant_type=password",{method:"POST",auth:false,body:{email,password:pw}});
  // two-step sign-in: if this login has an authenticator set up, ask for the 6-digit code before going in
  if(!create){const f=await mfaVerified(j.access_token).catch(()=>null);if(f&&jwtAal(j.access_token)!=="aal2"){MFA.pending={j,email,factorId:f.id};MFA.err="";throw {code:"mfa",msg:""};}}
  await finishSignIn(j,email);
}

/* Field-by-field merge. When this phone has unsent changes to a record that another phone also changed,
   keep both sides' edits: compare each against the last version both agreed on (the "base"). */
const BASE={get:k=>MDB.get("b:"+k).then(v=>v?JSON.parse(v):undefined).catch(()=>undefined),
  put:(k,d)=>{let t;try{t=JSON.stringify(d);}catch(e){return;}MDB.put("b:"+k,t).catch(()=>{});},del:k=>MDB.del("b:"+k).catch(()=>{})};
function stab(v){return JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);}
const isObj=v=>!!v&&typeof v==="object"&&!Array.isArray(v);
const idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&x.id!=null&&x.id!=="")&&new Set(a.map(x=>String(x.id))).size===a.length;
function merge3(b,l,r,localWins){
  const sl=stab(l),sr=stab(r);if(sl===sr)return l;const sb=stab(b);
  if(sl===sb)return r;if(sr===sb)return l;
  if(isObj(l)&&isObj(r)){const bb=isObj(b)?b:{},o={};
    for(const k of new Set([...Object.keys(r),...Object.keys(l)])){const v=merge3(bb[k],l[k],r[k],localWins);if(v!==undefined)o[k]=v;}return o;}
  if(idArr(l)&&idArr(r)&&(b===undefined||idArr(b))&&(l.length||r.length)){   // lists of things with ids (photos, vehicles, lines…)
    const m=a=>new Map((a||[]).map(x=>[String(x.id),x])),ml=m(l),mr=m(r),mb=m(b);const out=[];
    for(const id of [...r.map(x=>String(x.id)),...l.map(x=>String(x.id)).filter(id=>!mr.has(id))]){const v=merge3(mb.get(id),ml.get(id),mr.get(id),localWins);if(v!==undefined)out.push(v);}
    return out;}
  return localWins?l:r;
}
async function syncNow(full){
  if(!AUTH||APP.sample)return;if(SYNC.busy){SYNC.again=true;return;}
  if(MFA.lock||(jwtAal(AUTH.access_token)!=="aal2"&&await mfaLockCheck())){SYNC.state="error";SYNC.err="Enter your sign-in code";syncLabel();mfaLockShow();return;}
  SYNC.busy=true;SYNC.state="syncing";syncLabel();
  try{
    if(!AUTH.shop_id){const shop=await supa("/rest/v1/rpc/my_shop",{method:"POST",body:{}});AUTH.shop_id=typeof shop==="string"?shop:shop;saveAuth();}
    const shopId=AUTH.shop_id;if(SMETA.shop!==shopId){SMETA={shop:shopId,cursor:"",h:{},t:{},lh:{},based:1};}
    SMETA.h=SMETA.h||{};
    const first=!SMETA.cursor;
    // local fingerprints: what's changed here since the last sync ("dirty"), and when it last changed
    const loc=localRecords(),lh={},t0=Date.now();loc.forEach(r=>{lh[r.kind+":"+r.id]=h32(JSON.stringify(r.data));});
    const dirty=k=>k in lh&&SMETA.h[k]!==lh[k];
    SMETA.t=SMETA.t||{};SMETA.lh=SMETA.lh||{};
    for(const k in lh){if(dirty(k)){if(SMETA.lh[k]!==lh[k]){SMETA.lh[k]=lh[k];SMETA.t[k]=t0;}}else{delete SMETA.t[k];delete SMETA.lh[k];}}
    if(!SMETA.based){for(const r of loc){const k=r.kind+":"+r.id;if(!dirty(k)&&SMETA.h[k])BASE.put(k,r.data);}SMETA.based=1;}
    const locBy={};loc.forEach(r=>{locBy[r.kind+":"+r.id]=r;});
    // 1) pull what changed elsewhere. Unsent local edits win; on a device's first sync, the account's settings win.
    let changed=0;
    for(let guard=0;guard<40;guard++){
      const q=`/rest/v1/records?select=kind,id,data,deleted,updated_at&shop_id=eq.${shopId}${SMETA.cursor?`&updated_at=gt.${encodeURIComponent(SMETA.cursor)}`:""}&order=updated_at.asc&limit=500`;
      const rows=await supa(q);if(!rows||!rows.length)break;
      for(const r of rows){const k=r.kind+":"+r.id;SMETA.cursor=r.updated_at;
        if(!(k in lh)&&k in SMETA.h&&!r.deleted)continue;             // I deleted it here; the delete gets pushed below
        if(dirty(k)&&!(first&&r.kind==="settings")&&r.kind!=="techcfg"){
          if(r.deleted)continue;                                       // deleted elsewhere but changed here: keep mine
          // both phones changed it: merge field by field; where both changed the same field, the newer change wins
          const base=await BASE.get(k),lt=SMETA.t[k]||0,rt=Date.parse(r.updated_at)||0;
          const localWins=base!==undefined?lt>rt:lt>0&&lt<t0;      // no base yet: only edits made before this sync count
          const mine=locBy[k]?JSON.parse(JSON.stringify(locBy[k].data)):{};
          const merged=merge3(base,mine,r.data,localWins);
          changed+=applyRemote({...r,data:merged});
          const rh=h32(JSON.stringify(r.data));SMETA.h[k]=rh;BASE.put(k,r.data);
          const cur=localRecords().find(x=>x.kind+":"+x.id===k);lh[k]=cur?h32(JSON.stringify(cur.data)):rh;
          if(lh[k]===rh){delete SMETA.t[k];delete SMETA.lh[k];}else{SMETA.lh[k]=lh[k];}
          continue;}
        const c=applyRemote(r);changed+=c;if(r.deleted)BASE.del(k);else BASE.put(k,r.data);if(k in lh||r.deleted)delete lh[k];}
      saveMeta();if(rows.length<500)break;}
    if(!isTech()){if((APP.settings.techs||[]).length&&(!TEAM.at||Date.now()-TEAM.at>120000))await loadTeam(true);stampTechUsers();if(lockInvoices())changed++;if(parseIncoming())changed++;}
    // 2) push what changed here (and deletions)
    const now=localRecords(),seen=new Set(),push=[];
    now.forEach(r=>{const k=r.kind+":"+r.id;seen.add(k);const hh=h32(JSON.stringify(r.data));if(SMETA.h[k]!==hh)push.push({row:{shop_id:shopId,kind:r.kind,id:r.id,data:r.data,deleted:false},k,hh});});
    if(isTech()){ // jobs taken off my list disappear from this phone
      const vis=await supa(`/rest/v1/records?select=id&kind=eq.job&deleted=eq.false&shop_id=eq.${shopId}`);const ids=new Set((vis||[]).map(x=>String(x.id)));
      const before=APP.jobs.length;APP.jobs=APP.jobs.filter(j=>ids.has(String(j.id))||!(SMETA.h["job:"+j.id]));
      Object.keys(SMETA.h).forEach(k=>{if(k.startsWith("job:")&&!ids.has(k.slice(4)))delete SMETA.h[k];});if(APP.jobs.length!==before){changed++;syncActive();}}
    Object.keys(SMETA.h).forEach(k=>{if(!isTech()&&!seen.has(k)&&!k.startsWith("settings:")&&!k.startsWith("techcfg:")){const [kind,...rest]=k.split(":");push.push({row:{shop_id:shopId,kind,id:rest.join(":"),data:{},deleted:true},k,hh:null});}});
    for(let i=0;i<push.length;i+=25){const chunk=push.slice(i,i+25);
      await supa("/rest/v1/records?on_conflict=shop_id,kind,id",{method:"POST",body:chunk.map(x=>x.row),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
      chunk.forEach(x=>{if(x.hh){SMETA.h[x.k]=x.hh;BASE.put(x.k,x.row.data);}else{delete SMETA.h[x.k];BASE.del(x.k);}delete SMETA.t[x.k];delete SMETA.lh[x.k];});saveMeta();}
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(APP));}catch(e){}rebuildChecklist(APP.settings);const y=window.scrollY;if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){render();window.scrollTo(0,y);}}
    if(!PLAN||Date.now()-(PLAN.at||0)>10*60000||PLAN.shop_id!==AUTH.shop_id)await fetchPlan();
    SYNC.state="ok";SYNC.err="";SYNC.last=Date.now();if(OPEN_JOB)setTimeout(tryOpenJob,0);setTimeout(mediaSyncUp,0);setTimeout(()=>countyFill(30),4000);SMETA.lastAt=SYNC.last;saveMeta();
  }catch(e){SYNC.state=e.code==="offline"?"offline":e.code==="signedout"?"off":"error";SYNC.err=e.msg||"Sync failed";}
  finally{SYNC.busy=false;syncLabel();if(SYNC.again){SYNC.again=false;scheduleSync();}}
}
function applyRemote(r){

const JOB_CATS=[["Front brakes",/front.{0,25}(brake|pad|rotor)|(brake|pad|rotor).{0,25}front/i],["Rear brakes",/rear.{0,25}(brake|pad|rotor|shoe|drum)|(brake|pad|rotor|shoe|drum).{0,25}rear/i],
  ["Brakes",/brake|pads?\b|rotors?\b|caliper/i],["Oil change",/oil (and|&) filter|oil change|\boil\b.{0,10}service|\blof\b/i],["Battery",/battery/i],["Alternator",/alternator/i],["Starter",/starter/i],
  ["Spark plugs",/spark plug|tune.?up|ignition coil|coil pack/i],["Serpentine belt",/serpentine|drive belt|belt tensioner/i],["Diagnosis",/diagnos|check engine|cel\b|scan|no.?start|won'?t start|electrical/i],
  ["Coolant / thermostat",/coolant|thermostat|radiator|overheat|water pump/i],["Fluid service",/fluid (flush|service|exchange)|brake fluid|power steering fluid/i],["Sensor",/sensor|o2|oxygen|map sensor|maf/i],["Suspension",/strut|shock|control arm|sway|tie rod|ball joint/i],
  ["Pre-purchase inspection",/pre-?purchase|\bppi\b/i]];
function jobCat(j){if(!isSvc(j))return "Pre-purchase inspection";if(j.menuName){const c=JOB_CATS.find(([n,re])=>re.test(j.menuName));return c?c[0]:j.menuName;}
  const txt=[j.info.work,(j.invoice.lines||[]).map(x=>x.d).join(" ")].join(" ");const c=JOB_CATS.find(([n,re])=>re.test(txt));return c?c[0]:"";}
const tmrHours=j=>{const t=j.timer;if(!t)return 0;let ms=(t.segs||[]).reduce((a,x)=>a+(x.e-x.s),0);if(t.run)ms+=Date.now()-t.run;return ms/3600000;};
const jobHours=j=>num(j.actualHrs)||(j.timer?Math.round(tmrHours(j)*10)/10:0);
function catStats(cat,exceptId){if(!cat)return null;const js=APP.jobs.filter(j=>j.id!==exceptId&&j.status==="done"&&jobCat(j)===cat&&jobHours(j)>0);
  if(!js.length)return null;const hs=js.map(jobHours).sort((a,b)=>a-b);const avg=hs.reduce((a,h)=>a+h,0)/hs.length;
  const billed=js.reduce((a,j)=>{const t=totals(j);return a+(t.svc?t.labor:t.fee)-(t.disc||0)*0;},0),hrs=hs.reduce((a,h)=>a+h,0);
  return {cat,n:js.length,avg:Math.round(avg*10)/10,min:hs[0],max:hs[hs.length-1],rate:hrs?billed/hrs:0};}
const fmtHM=h=>{const m=Math.round(h*60);return m<60?`${m} min`:`${Math.floor(m/60)} hr ${String(m%60).padStart(2,"0")} min`;};
function timerHTML(){
  const t=S.timer||{segs:[]},run=!!t.run,h=tmrHours(S),cat=jobCat(S),st=catStats(cat,S.id),done=S.status==="done";
  return `<div class="form tmr-card" id="tmrCard"><p class="formh">⏱ Job time</p>
    <div class="full tmr-row"><strong class="tmr-clock${run?" on":""}" id="tmrClock">${h?fmtHM(h):"0 min"}</strong>
      ${done?"":run?`<button class="btn" type="button" data-tmr="pause">Pause</button><button class="btn primary" type="button" data-tmr="stop">Stop</button>`
        :`<button class="btn primary" type="button" data-tmr="start">${h?"Resume":"Start timer"}</button>${h?`<button class="mini del" type="button" data-tmr="reset">Reset</button>`:""}`}</div>
    <label>Actual hours<input data-acthrs="1" inputmode="decimal" value="${esc(S.actualHrs||"")}" placeholder="${h?(Math.round(h*10)/10):"e.g. 1.5"}"><span class="help">Forgot the timer? Type it here.</span></label>
    <div class="tmr-use">${jobHours(S)?`<button class="mini" type="button" data-tmr="uselabor">Use ${jobHours(S)} hr on the labor line</button>`:""}</div>
    <div class="full tmr-avg">${cat?(st?`<strong>Your average for ${esc(cat)}: ${st.avg} hr</strong> <span class="help">(${st.n} job${st.n===1?"":"s"} · fastest ${st.min.toFixed(1)}, longest ${st.max.toFixed(1)}${st.rate?` · your labor earns about ${money(st.rate)}/hr on these`:""})</span>${done?"":` <button class="mini" type="button" data-tmr="useavg">Use ${st.avg} hr</button>`}`
      :`<span class="help">First ${esc(cat)} job with a time. Your average shows here after you finish it.</span>`):`<span class="help">Add the work above (or pick from your service menu) and the app will track your average time for this kind of job.</span>`}</div>
  </div>`;
}
let TMR_IV=null;
function tickTimer(){clearInterval(TMR_IV);if(!S||!S.timer||!S.timer.run)return;TMR_IV=setInterval(()=>{const el=document.getElementById("tmrClock");if(!el||!S||!S.timer||!S.timer.run){clearInterval(TMR_IV);return;}el.textContent=fmtHM(tmrHours(S));},15000);}
function jobTimesHTML(){
  const cats=[...new Set(APP.jobs.filter(j=>j.status==="done"&&jobHours(j)>0).map(jobCat).filter(Boolean))].map(c=>catStats(c)).filter(Boolean).sort((a,b)=>b.n-a.n).slice(0,8);

  return `<div class="dash-card"><div class="dc-h"><h3>Your job times</h3><span class="ts">Average · all time</span></div>
    ${cats.map(c=>`<div class="jt-row"><span>${esc(c.cat)}</span><span class="ts">${c.n} job${c.n===1?"":"s"}</span><strong>${c.avg} hr</strong><span class="ts">${c.rate?money(c.rate)+"/hr":""}</span></div>`).join("")}<p class="help" style="margin:8px 0 0">$/hr = labor charged ÷ your actual time (parts not counted).</p></div>`;
}

/* ================= route planning ================= */
let ROUTE=null; // {day,state,order:[{j,lat,lon,leg}],start,total,missing}
async function planRoute(day,useHere){
  const js=APP.jobs.filter(j=>j.info.date===day&&isBooked(j));
  ROUTE={day,state:"loading",n:js.length,done:0};rerenderKeep();
  let start=null,startName="";
  if(useHere){const h=await herePos();if(h){start=h;startName="Your location";}}
  if(!start&&hasHQ()){start={lat:APP.settings.hqLat,lon:APP.settings.hqLon};startName="Home base";}
  const pts=[],missing=[];
  for(const j of js){if(!j.info.location){missing.push(j);continue;}
    const cached=APP.geo&&APP.geo[j.info.location.trim().toLowerCase().replace(/\s+/g," ")];
    const g=cached||await geocode(j.info.location).catch(()=>null);if(!cached)await new Promise(r=>setTimeout(r,1100));
    if(g)pts.push({j,lat:g.lat,lon:g.lon});else missing.push(j);
    if(ROUTE&&ROUTE.day===day){ROUTE.done++;const el=document.getElementById("routeProg");if(el)el.textContent=`Finding ${ROUTE.done} of ${js.length} addresses…`;}}
  if(!ROUTE||ROUTE.day!==day)return;
  const order=[];let cur=start||(pts[0]&&{lat:pts[0].lat,lon:pts[0].lon});const left=[...pts];let total=0;
  while(left.length){let bi=0,bd=Infinity;left.forEach((p,k)=>{const dd=crowMiles(cur,p);if(dd<bd){bd=dd;bi=k;}});const p=left.splice(bi,1)[0];const leg=Math.round(bd*1.25*10)/10;
    order.push({...p,leg:start||order.length?leg:0});total+=start||order.length>1?leg:0;cur=p;}
  save();ROUTE={day,state:"ready",order,start,startName,total:Math.round(total*10)/10,missing};rerenderKeep();
}

  const billedHrs=timed.reduce((a,j)=>a+(j.invoice.lines||[]).filter(l=>l.k==="labor").reduce((b,l)=>b+num(l.q),0),0);

  const why={};holds.forEach(r=>why[r]=(why[r]||0)+1);const topHold=Object.entries(why).sort((a,b)=>b[1]-a[1])[0];

async function countyFill(max){
  if(CTY_BUSY||APP.sample||isTech()||!navigator.onLine)return;CTY_BUSY=true;let looked=0,changed=false;
  const todo=[];
  const jobs=[...APP.jobs].sort((a,b)=>(isOpenJob(b)-isOpenJob(a))||String(jDate(b)).localeCompare(String(jDate(a))));
  jobs.forEach(j=>{const loc=(j.info.location||"").trim();if(loc&&j.info.countyFor!==loc)todo.push({o:j.info,loc});});
  (APP.customers||[]).forEach(c=>{const loc=(c.location||"").trim();if(loc&&c.countyFor!==loc)todo.push({o:c,loc});});
  try{for(const t of todo){if(looked>=(max||30))break;
      const key=t.loc.toLowerCase().replace(/\s+/g," ");let g=APP.geo&&APP.geo[key];
      if(!g||g.county===undefined){g=await geocode(t.loc,true);looked++;await new Promise(r=>setTimeout(r,1100));}
      if((t.o.location||"").trim()!==t.loc)continue;
      if(g&&g.county){t.o.county=g.county;}
      t.o.countyFor=t.loc;changed=true;}}
  catch(e){}
  finally{CTY_BUSY=false;
    if(changed){save();if(["jobs","customers","dash"].includes(APP.view)&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))rerenderKeep();}}}

function barChart(vals){
  const W=600,H=230,padL=84,padR=8,top=20,bot=36,max=Math.max(1,...vals.map(v=>v.v)),bw=(W-padL-padR)/vals.length;
  const nice=(()=>{const raw=max;const p=Math.pow(10,Math.floor(Math.log10(raw)));const m=raw/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p;})();
  const y=v=>top+(H-top-bot)*(1-v/nice);
  const grid=[0.5,1].map(f=>`<line x1="${padL}" x2="${W-padR}" y1="${y(nice*f).toFixed(1)}" y2="${y(nice*f).toFixed(1)}" class="gl"/><text x="${padL-10}" y="${(y(nice*f)+7).toFixed(1)}" class="gt" text-anchor="end">${money(nice*f).replace(".00","")}</text>`).join("");
  const bars=vals.map((v,k)=>{const x=padL+k*bw+bw*0.2,w=bw*0.6,h=Math.max(0,(H-bot)-y(v.v)),cur=k===vals.length-1;
    const r=Math.min(4,w/2,h);const yy=y(v.v);
    const path=h>0?`M${x},${H-bot} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+w-r} Q${x+w},${yy} ${x+w},${yy+r} V${H-bot} Z`:"";

const cleanCounty=c=>String(c||"").replace(/\s+(County|Parish|Borough|Census Area|Municipality)$/i,"").trim();
async function geocode(addr,needCounty){
  const q=String(addr||"").trim();if(!q)return null;
  const key=q.toLowerCase().replace(/\s+/g," ");APP.geo=APP.geo||{};
  if(APP.geo[key]&&(!needCounty||APP.geo[key].county!==undefined))return APP.geo[key];
  const cc=APP.settings.hqCC&&key!==String(APP.settings.hq||"").trim().toLowerCase().replace(/\s+/g," ")?"&countrycodes="+APP.settings.hqCC:"";
  let hit=null;
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1${cc}&q=${encodeURIComponent(q)}`,{headers:{"Accept-Language":"en"}});
    const a=await r.json();if(a&&a[0])hit={lat:+a[0].lat,lon:+a[0].lon,cc:(a[0].address&&a[0].address.country_code)||"",name:a[0].display_name||"",county:cleanCounty(a[0].address&&a[0].address.county)};}catch(e){}
  if(!hit){try{const bias=APP.settings.hqLat!=null?`&lat=${APP.settings.hqLat}&lon=${APP.settings.hqLon}`:"";
    const r=await fetch(`https://photon.komoot.io/api/?limit=1&lang=en${bias}&q=${encodeURIComponent(q)}`);const a=await r.json();const f=a&&a.features&&a.features[0];
    if(f){const pr=f.properties||{};hit={lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],cc:(pr.countrycode||"").toLowerCase(),name:[pr.name,pr.street,pr.city,pr.state].filter(Boolean).join(", "),county:cleanCounty(pr.county)};}}catch(e){}}
  if(hit){const ks=Object.keys(APP.geo);if(ks.length>300)delete APP.geo[ks[0]];APP.geo[key]=hit;}
  return hit;
}
function crowMiles(a,b){const R=3958.8,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);
  const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
async function distFromHQ(addr){
  if(!hasHQ())return {err:"nohq"};
  const to=await geocode(addr);if(!to)return {err:"notfound"};
  const from={lat:APP.settings.hqLat,lon:APP.settings.hqLon};
  try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=false`);
    const j=await r.json();const rt=j&&j.routes&&j.routes[0];
    if(rt)return {mi:Math.round(rt.distance/160.9344)/10,min:Math.round(rt.duration/60),road:true};}catch(e){}
  return {mi:Math.round(crowMiles(from,to)*1.25*10)/10,road:false};
}
const fmtMin=m=>m>=60?`${Math.floor(m/60)} hr ${m%60} min`:`${m} min`;
let DIST_SEQ=0;
async function calcDist(target,quiet){
  const job=target==="draft"?null:S, obj=target==="draft"?APP.draft:(job&&job.info);if(!obj)return;
  const addr=(obj.location||"").trim(), msg=()=>document.getElementById(target==="draft"?"distMsg":"distMsgI");
  const say=(t,cls="")=>{const m=msg();if(m){m.textContent=t;m.className="help dist-msg "+cls;}else if(cls)toast(t);};
  if(!hasHQ()){if(!quiet)toast("Add your home base address in Settings first");return;}
  if(!addr){if(!quiet)toast("Add the job address first");return;}
  const seq=++DIST_SEQ;say("Calculating distance…");
  const r=await distFromHQ(addr);if(seq!==DIST_SEQ)return;
  if(r.err){say(r.err==="notfound"?"Couldn't find that address on the map. Check it, or type the miles yourself.":"","bad");return;}
  if(target==="draft"){if(APP.draft!==obj)return;}else if(S!==job)return;
  obj.dist=String(r.mi);save();
  ["d-dist","inv-dist","inv-dist2"].forEach(id=>{const el=document.getElementById(id);if(el&&el.dataset[target==="draft"?"draft":"info"]==="dist"){el.value=obj.dist;el.dispatchEvent(new Event("input",{bubbles:true}));}});
  say(r.road?`${r.mi} mi, about ${fmtMin(r.min)} drive from your home base`:`About ${r.mi} mi from your home base (estimated, road route unavailable)`,"ok");
}

const VIN_DEC={};let VINMSG=null; // {id,vin,html}
const titleMake=m=>!m?"":m.length<=3?m.toUpperCase():m.toLowerCase().replace(/(^|[\s-])([a-z])/g,(a,b,c)=>b+c.toUpperCase());
async function decodeVin(vin){
  vin=String(vin||"").toUpperCase();if(VIN_DEC[vin])return VIN_DEC[vin];
  const r=await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${encodeURIComponent(vin)}?format=json`);
  const j=await r.json();const x=j&&j.Results&&j.Results[0];if(!x)return null;
  const c=v=>{v=String(v==null?"":v).trim();return /^(not applicable|null|0)$/i.test(v)?"":v;};
  const disp=c(x.DisplacementL)&&parseFloat(x.DisplacementL)>0?(Math.round(parseFloat(x.DisplacementL)*10)/10).toFixed(1)+"L":"";
  const cyl=c(x.EngineCylinders),cfg=c(x.EngineConfiguration);
  const cylS=cyl?(/^V/i.test(cfg)?"V"+cyl:/in-?line/i.test(cfg)?"I"+cyl:/flat|horizontal/i.test(cfg)?"H"+cyl:cyl+"-cyl"):"";
  const fuel=c(x.FuelTypePrimary),elec=c(x.ElectrificationLevel);
  const engine=[disp,cylS,/diesel/i.test(fuel)?"Diesel":"",/hybrid/i.test(elec)?"Hybrid":"",(/electric/i.test(fuel)&&!disp)?"Electric":"",c(x.Turbo)&&/yes/i.test(x.Turbo)?"Turbo":""].filter(Boolean).join(" ");
  const d={year:c(x.ModelYear),make:titleMake(c(x.Make)),model:c(x.Model),trim:c(x.Trim)||c(x.Series),engine,drive:(c(x.DriveType).split("/")[0]||"").trim()};
  if(!d.make&&!d.model)return null;
  VIN_DEC[vin]=d;return d;
}
const vinReady=v=>{v=String(v||"").toUpperCase().replace(/\s/g,"");return v.length===17&&!/[IOQ]/.test(v)&&/^[A-Z0-9]+$/.test(v);};

function vinCheck(v){
  v=(v||"").toUpperCase().replace(/\s/g,"");
  if(!v) return {cls:"",msg:""};
  if(/[IOQ]/.test(v)) return {cls:"err",msg:"VINs never contain I, O, or Q"};
  if(v.length!==17) return {cls:"err",msg:`${v.length} of 17 characters`};
  const map={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
  const w=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
  let sum=0;for(let i=0;i<17;i++){const c=v[i];const n=/\d/.test(c)?+c:map[c];if(n===undefined)return{cls:"err",msg:"Invalid character"};sum+=n*w[i]}
  const cd=sum%11===10?"X":String(sum%11);
  return cd===v[8]?{cls:"ok",msg:"Check digit valid"}:{cls:"err",msg:`Check digit fails (expected ${cd} in position 9). Re-read the VIN.`};
}
function stats(job=S){

  const done=good+mon+bad+na;
  return {good,mon,bad,na,done,open:its.length-done,total:its.length};
}

const RATE_KEYS=["taxRate","freeMiles","perMile"];
function rates(job){const L=job&&job.invoice&&job.invoice.lock;return L?{...APP.settings,...L}:APP.settings;}
function rateLock(){const st=APP.settings,o={at:TODAY};RATE_KEYS.forEach(k=>{o[k]=st[k];});return o;}
function lockInvoices(){if(isTech()||APP.sample)return 0;let n=0;
  for(const j of APP.jobs||[]){const inv=j.invoice;if(!inv)continue;const fin=j.status==="done"||!!inv.paid;
    if(fin&&!inv.lock){inv.lock=rateLock();n++;}
    else if(!fin&&inv.lock&&j.status!=="canceled"){delete inv.lock;n++;}
    if(j.status==="done"&&!j.payLock&&!j.paidOut){const p=payTerms(j);if(p){const t=techOf(j);j.payLock={...p,show:!!(t&&t.pay&&t.pay.show)};n++;}}
    else if(j.status!=="done"&&j.payLock&&!j.paidOut){delete j.payLock;n++;}}
  return n;}
function lockNoteHTML(job){const L=job&&job.invoice&&job.invoice.lock;if(!L||isTech())return "";
  const cur=APP.settings,diff=RATE_KEYS.some(k=>String(L[k]??"")!==String(cur[k]??""));
  return `<p class="help lock-note">🔒 Billed at: tax ${esc(String(num(L.taxRate)))}%, travel ${money(L.perMile)}/mi after ${esc(String(num(L.freeMiles)))} mi.${diff?` Your rates have changed since; this invoice keeps the old ones. <button class="mini" type="button" data-act="relock">Use today's rates</button>`:""}</p>`;}
function travelCalc(job){
  const st=rates(job), inv=job.invoice;
  if(inv.travelOverride!==""&&inv.travelOverride!=null) return {fee:num(inv.travelOverride),auto:false};
  const d=num(job.info.dist), billable=Math.max(0,d-num(st.freeMiles));
  return {fee:Math.round(billable*num(st.perMile)),auto:true,billable,d};
}
/* ---- discounts: applied to the subtotal, before tax ---- */
function discAmt(inv,pre){const d=inv.disc;if(!d||!num(d.v))return 0;
  const a=d.t==="pct"?Math.round(pre*Math.min(100,num(d.v)))/100:num(d.v);return Math.max(0,Math.min(pre,Math.round(a*100)/100));}
function discLabel(inv){const d=inv.disc;if(!d||!num(d.v))return "";const r=String(d.r||"").trim();
  return `Discount${r?" – "+r:""}${d.t==="pct"?` (${num(d.v)}%)`:""}`;}
const negMoney=a=>"−"+money(a);
const DISC_QUICK=[["pct","10"],["pct","15"],["amt","20"],["amt","50"]];
function discHTML(){
  const inv=S.invoice,d=inv.disc;
  if(!d)return `<div class="copyrow" style="margin-top:8px"><button class="mini" type="button" data-discadd="1">＋ Discount</button></div>`;
  const t=totals(S);
  return `<div class="ln disc-ln"><div class="ln-top"><strong>Discount</strong><button class="xbtn" type="button" data-discdel="1" aria-label="Remove discount">×</button></div>
    <input id="disc-r" data-disc="r" value="${esc(d.r||"")}" placeholder="Reason (optional), e.g. Military, returning customer" autocomplete="off">
    <div class="disc-row"><div class="seg disc-seg" role="group" aria-label="Percent or dollars"><button type="button" data-disct="pct" aria-pressed="${d.t==="pct"}">%</button><button type="button" data-disct="amt" aria-pressed="${d.t!=="pct"}">$</button></div>
      <input id="disc-v" data-disc="v" inputmode="decimal" value="${esc(d.v||"")}" placeholder="${d.t==="pct"?"10":"25.00"}" aria-label="Discount ${d.t==="pct"?"percent":"amount"}">
      <strong class="disc-amt" id="discAmt">${t.disc?negMoney(t.disc):"—"}</strong></div>
    <div class="disc-quick">${DISC_QUICK.map(([k,v])=>`<button class="mini" type="button" data-discq="${k}:${v}">${k==="pct"?v+"% off":"$"+v+" off"}</button>`).join("")}</div>
  </div>`;
}
function totals(job){
  const inv=job.invoice, st=rates(job);
  if(isSvc(job)){
    const ls=inv.lines||[],sum=k=>ls.filter(x=>x.k===k).reduce((a,x)=>a+lineAmt(x),0);
    const labor=sum("labor")+sum("flat"),parts=sum("part"),fees=sum("fee"),tr=travelCalc(job);
    const pre=labor+parts+fees+tr.fee,disc=discAmt(inv,pre),sub=Math.round((pre-disc)*100)/100;
    const taxOn=inv.tax==null?!!st.taxOn:inv.tax;
    const tax=taxOn?Math.round(sub*num(st.taxRate))/100:0;
    return {svc:true,fee:0,labor,parts,fees,travel:tr,extras:labor+parts+fees,pre,disc,discLabel:discLabel(inv),sub,taxOn,tax,total:sub+tax};
  }
  const fee=inv.fee==null?num(st.fee):num(inv.fee);
  const tr=travelCalc(job);
  const extras=inv.items.reduce((a,x)=>a+num(x.a),0);
  const pre=fee+tr.fee+extras,disc=discAmt(inv,pre),sub=Math.round((pre-disc)*100)/100;
  const taxOn=inv.tax==null?!!st.taxOn:inv.tax;
  const tax=taxOn?Math.round(sub*num(st.taxRate))/100:0;
  return {fee,travel:tr,extras,pre,disc,discLabel:discLabel(inv),sub,taxOn,tax,total:sub+tax};
}
function jobTotal(job){return totals(job).total;}

    save();rerenderKeep();toast(isTech()?"Job stopped. The office has it now.":"Job stopped. You can still bill for what was done.");jcNotifyManagers(j,`${jcWho()} stopped a job: ${P.reason}`);return;}
  if(k==="cancelgo"){if(!P||!P.reason){toast("Pick a reason");return;}
    jcTimer(j,false);j.canceled={reason:P.reason,note:(P.note||"").trim(),at:Date.now(),by:jcWho(),prev:j.status};j.status="canceled";j.hold=null;jcLog(j,"cancel",{reason:P.reason});JCTL=null;

function backupText(){
  const copy=JSON.parse(JSON.stringify(APP));
  delete copy.adding;delete copy.draft;delete copy.editing;delete copy.confirmDel;delete copy.snaps;delete copy.snapAt;
  if(!APP.bkPhotos)copy.jobs.forEach(j=>Object.values(j.results).forEach(r=>{r.photos=[]}));
  // Letters, digits, - and _ only, so Notes, email and texts can't scramble it.
  const bytes=new TextEncoder().encode(JSON.stringify(copy));
  let bin="";for(let k=0;k<bytes.length;k+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(k,k+8192));
  return "HONESTECH-PPI-BACKUP-V2-"+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function parseBackup(txt){
  txt=String(txt||"");
  const valid=o=>o&&Array.isArray(o.jobs)&&o.settings?o:null;
  const m=txt.match(/HONESTECH-PPI-BACKUP/i);
  if(!m)return null;
  let rest=txt.slice(m.index+m[0].length);
  // New format: base64url after "-V2-"
  const v2=rest.match(/^\s*-\s*V2\s*-/i);
  if(v2){
    try{
      let s=rest.slice(v2[0].length).replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
      while(s.length%4)s+="=";
      const bin=atob(s);const bytes=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)bytes[k]=bin.charCodeAt(k);
      return valid(JSON.parse(new TextDecoder().decode(bytes)));
    }catch(e){return null;}
  }
  // Old format: raw JSON, possibly URL-encoded or with curly quotes from Notes
  for(let pass=0;pass<3&&/%[0-9A-Fa-f]{2}/.test(rest);pass++){
    try{rest=decodeURIComponent(rest.replace(/\+/g," "));}catch(e){break;}
  }
  rest=rest.replace(/[“”„‟″]/g,'"').replace(/[‘’‚‛′]/g,"'");
  const a=rest.indexOf("{"),b=rest.lastIndexOf("}");
  if(a<0||b<a)return null;
  try{return valid(JSON.parse(rest.slice(a,b+1)));}catch(e){return null;}
}

const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==="function");
let CLAUDE_DL=null,CLAUDE_DL_READY=null;
if(IN_CLAUDE)CLAUDE_DL_READY=window.claude.use("downloads").then(d=>(CLAUDE_DL=d)).catch(()=>null);
function webSaveAvailable(){return !IN_CLAUDE&&typeof Blob!=="undefined";}
async function getSaver(){
  if(IN_CLAUDE){const d=CLAUDE_DL||await CLAUDE_DL_READY;return d?{save:(filename,data)=>d.save({filename,data}).then(r=>r.status)}:null;}
  if(!webSaveAvailable())return null;
  return {save:async(filename,data)=>{
    const type=/\.pdf$/i.test(filename)?"application/pdf":/\.csv$/i.test(filename)?"text/csv":"text/plain";
    const blob=data instanceof Blob?data:new Blob([data],{type});
    if(NATIVE){try{const f=new File([blob],filename,{type:blob.type||type});await nativeShareFiles([f]);return "saved";}catch(e){if(e&&e.name==="AbortError")throw {code:"declined"};throw e;}}
    let file=null;try{file=new File([blob],filename,{type:blob.type||type});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return "saved";}
      catch(e){if(e&&e.name==="AbortError")throw {code:"declined"};}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);return "saved";
  }};
}
/* ---------- automatic daily copies (kept on this phone, last 14 days) ---------- */
const SNAP_KEEP=14;
async function autoSnapshot(force){
  if(APP.sample||!APP.jobs.length)return;
  const day=TODAY;APP.snaps=APP.snaps||[];
  if(!force&&APP.snaps.includes(day)&&APP.snapAt&&Date.now()-APP.snapAt<15*60000)return;
  try{
    await MDB.put("snap:"+day,{text:backupText(),at:Date.now(),jobs:APP.jobs.length});
    if(!APP.snaps.includes(day))APP.snaps.push(day);APP.snaps.sort();APP.snapAt=Date.now();
    while(APP.snaps.length>SNAP_KEEP){const old=APP.snaps.shift();MDB.del("snap:"+old).catch(()=>{});}
    try{localStorage.setItem(KEY,JSON.stringify(APP));}catch(e){}
  }catch(e){console.error("snapshot failed",e);}
}

  const list=[...(APP.snaps||[])].reverse();

}

const MDB={_p:null,
  open(){return this._p||(this._p=new Promise((res,rej)=>{const r=indexedDB.open("honestech-ppi-media",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("m");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("m",mode);const st=t.objectStore("m");const out=fn(st);
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(id,v){return this.tx("readwrite",st=>st.put(v,id));},
  get(id){return this.tx("readonly",st=>st.get(id));},
  del(id){return this.tx("readwrite",st=>st.delete(id));}
};
const MEDIA_FILE={},MEDIA_URL={},MEDIA_OBJ={};   // id -> File (for sharing), dataURL (photos, for PDF), objectURL (viewing)

const MTAGS=[["before","Before"],["after","After"],["finding","Finding"]];

  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);return c;}

function videoThumb(file){return new Promise(res=>{const u=URL.createObjectURL(file),v=document.createElement("video");let done=false;
  const fin=x=>{if(done)return;done=true;URL.revokeObjectURL(u);res(x);};
  v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";v.src=u;
  v.onloadedmetadata=()=>{const dur=isFinite(v.duration)?v.duration:0;try{v.currentTime=Math.min(0.5,dur/2||0);}catch(e){}
    v.onseeked=()=>{try{const c=drawTo(v,v.videoWidth||320,v.videoHeight||240,320);fin({thumb:c.toDataURL("image/jpeg",0.7),dur});}catch(e){fin({thumb:"",dur});}};};
  v.onerror=()=>fin({thumb:"",dur:0});setTimeout(()=>fin({thumb:"",dur:0}),6000);});}
async function addMediaFiles(job,files,kind){

function markupOpen(id,url){const im=new Image();im.onload=()=>{

    ov.innerHTML=`<div class="mk-box"><div class="mk-tools">${[["circle","◯ Circle"],["arrow","➜ Arrow"],["pen","✎ Draw"],["text","T Text"]].map(([k,l])=>`<button type="button" class="mk-t" data-mkt="${k}" aria-pressed="${k==="circle"}">${l}</button>`).join("")}

    document.body.appendChild(ov);document.documentElement.classList.add("sig-open");

function markupDraw(){const cv=document.getElementById("mkCv");if(!cv||!MK)return;const g=cv.getContext("2d"),{W,H}=MK,lw=Math.max(4,Math.round(W/170));
  g.drawImage(MK.im,0,0,W,H);

  [...MK.shapes,...(MK.cur?[MK.cur]:[])].forEach(s=>{
    if(s.t==="circle")stroke(()=>{g.beginPath();g.ellipse((s.x1+s.x2)/2,(s.y1+s.y2)/2,Math.abs(s.x2-s.x1)/2+1,Math.abs(s.y2-s.y1)/2+1,0,0,Math.PI*2);},s.c);
    else if(s.t==="pen")stroke(()=>{g.beginPath();s.pts.forEach(([x,y],k)=>k?g.lineTo(x,y):g.moveTo(x,y));},s.c);
    else if(s.t==="arrow"){const a=Math.atan2(s.y2-s.y1,s.x2-s.x1),hl=lw*4.5;
      stroke(()=>{g.beginPath();g.moveTo(s.x1,s.y1);g.lineTo(s.x2,s.y2);g.moveTo(s.x2,s.y2);g.lineTo(s.x2-hl*Math.cos(a-0.5),s.y2-hl*Math.sin(a-0.5));g.moveTo(s.x2,s.y2);g.lineTo(s.x2-hl*Math.cos(a+0.5),s.y2-hl*Math.sin(a+0.5));},s.c);}

const PC={ink:[21,32,43],muted:[91,104,118],line:[213,219,226],paper:[244,246,248],
  good:[31,122,69],mon:[154,98,0],bad:[180,35,35],na:[107,116,128],

Object.defineProperty(PC,"accent",{get(){const st=APP.settings;if(st.pdfAccent&&st.themeAccent){const a=accentFor(st.themeAccent,false,[255,255,255]);if(a)return a.map(Math.round);}return [29,95,168];}});
const PW=612,PH=792,PM=40;
const pdfTxt=s=>String(isEs()?trDoc(s):(s??"")).replace(/[′]/g,"'").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF–—‘’“”•…]/g,"");
function pdfStart(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"letter",compress:true});
  const P={doc,y:PM};
  P.font=(size,style="normal",color=PC.ink)=>{doc.setFont("helvetica",style);doc.setFontSize(size);doc.setTextColor(...color);};
  P.need=(h)=>{if(P.y+h>PH-PM-8){doc.addPage();P.y=PM;return true;}return false;};
  P.text=(s,x,y,o)=>doc.text(Array.isArray(s)?s.map(pdfTxt):pdfTxt(s),x,y,o);
  P.wrap=(s,w)=>doc.splitTextToSize(pdfTxt(s),w);
  P.rule=(y,c=PC.line,w=0.75)=>{doc.setDrawColor(...c);doc.setLineWidth(w);doc.line(PM,y,PW-PM,y);};
  return P;

    if(d.info==="vin"){const vc=vinCheck(t.value);const m=$("#vinMsg");m.className="vinmsg "+vc.cls;m.textContent=vc.msg;
      const dz=$("#vinDec");if(dz&&!vinReady(t.value)){dz.innerHTML="";}
      if(vinReady(t.value)){const job=S;clearTimeout(window.__vd);window.__vd=setTimeout(()=>autoDecode(job),350);}}
    if(d.info==="dist")refreshTotals();
    saveSoon();return;}
  if(d.inv){S.invoice[d.inv]=t.value;saveSoon();refreshTotals();return;}
  if(d.fu){const f=S.followup||(S.followup={what:"",date:"",miles:"",status:"open"});f[d.fu]=t.value;f.status="open";saveSoon();
    if(d.fu==="date"){const y=window.scrollY;render();window.scrollTo(0,y);}return;}
  if(d.mcap){const m=(S.media||[]).find(x=>x.id===d.mcap);if(m){m.cap=t.value;saveSoon();}return;}
  if(d.lnd!==undefined){S.invoice.lines[+d.lnd].d=t.value;saveSoon();return;}
  if(d.lnq!==undefined||d.lnp!==undefined){const k=+(d.lnq??d.lnp),x=S.invoice.lines[k];if(d.lnq!==undefined)x.q=t.value;else x.p=t.value;
    const a=document.getElementById("ln-a-"+k);if(a)a.textContent=money(lineAmt(x));saveSoon();refreshTotals();return;}
  if(d.itd!==undefined){S.invoice.items[+d.itd].d=t.value;saveSoon();return;}
  if(d.ita!==undefined){S.invoice.items[+d.ita].a=t.value;saveSoon();refreshTotals();return;}
  if(d.note){res(d.note).note=t.value;saveSoon();return;}
  if(d.val){res(d.val).val=t.value;saveSoon();return;}
  if(d.corner){
    const [id,k]=d.corner.split(":");const it=ALL_ITEMS.find(x=>x.id===id);const r=res(id);const v=cornerVals(r);v[k]=t.value;
    t.closest(".corner").dataset.cr=cornerRate(it.corners,t.value);
    if(!r.r||r.auto){
      const rs=CORNERS.map(([c])=>cornerRate(it.corners,v[c])).filter(Boolean);
      r.r=rs.includes("bad")?"bad":rs.includes("mon")?"mon":rs.length?"good":"";r.auto=true;
      const el=t.closest(".item");el.dataset.r=r.r;el.querySelectorAll("[data-rate]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.rate===r.r)));
    }
    if(S.status==="sched")S.status="active";
    saveSoon();renderChrome();
  }
});
function refreshTotals(){const box=$("#totals");if(!box)return;const t=totals(S);box.innerHTML=totalsHTML(t);const ln=$("#lockNote");if(ln)ln.innerHTML=lockNoteHTML(S);const tr=$("#inv-travel");if(tr)tr.placeholder=t.travel.auto?String(t.travel.fee):"";}
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.setc){APP.settings[d.setc]=t.checked;save();if(d.setc==="bookOn"||(d.setc==="taxOn"&&APP.view==="welcome"))rerenderKeep();return;}
  if(d.compact){APP.compact=t.checked;save();rerenderKeep();return;}
  if(d.assign){const j=APP.jobs.find(x=>x.id===d.assign);if(j){const _pv=j.techId||"";const tm=teamList().find(x=>x.id===t.value);j.techId=tm?tm.id:"";setTimeout(()=>afterAssign(j,_pv,false),0);j.info.tech=tm?tm.name:"";if(!tm)j.dispatch="";else if(!j.dispatch)j.dispatch="assigned";save();rerenderKeep();toast(tm?`Assigned to ${tm.name}`:"Unassigned");}return;}
  if(d.draftc&&APP.draft){APP.draft[d.draftc]=t.checked;save();return;}
  if(d.reqc&&REQ_EDIT){REQ_EDIT[d.reqc]=t.checked;return;}
  if(d.restorefile){const f=t.files&&t.files[0];if(!f)return;
    const fr=new FileReader();fr.onload=()=>{const o=parseBackup(String(fr.result||""));t.value="";
      if(!o){toast("That file isn't a Honestech app backup.");return;}
      $("#restoreIn").value=String(fr.result);
      $("#restoreActs").innerHTML=`<div class="confirm" style="width:100%"><span>Replace everything on this phone with <strong>${esc(f.name)}</strong> (${o.jobs.length} job${o.jobs.length===1?"":"s"}, ${esc(o.settings.biz||"no business name")})?</span><button class="btn danger" type="button" data-act="doRestore">Replace with backup</button><button class="btn" type="button" data-act="cancelRestore">Cancel</button></div>`;
      $("#restoreActs").scrollIntoView({block:"center"});};
    fr.onerror=()=>toast("Couldn't open that file.");fr.readAsText(f);return;}
  if(d.zoho){const fl=[...(t.files||[])];t.value="";if(fl.length)zohoRead(fl);return;}
  if(d.bgimg){const f=t.files&&t.files[0];if(!f)return;toast("Adding picture…");
    loadBgImg(f).then(u=>{t.value="";if(!u){toast("Couldn't read that picture. Try a JPG or PNG.");return;}APP.settings.bgImg=u;if(APP.settings.bgDim==null||APP.settings.bgDim==="")APP.settings.bgDim=50;save();rerenderKeep();toast("Background set");});return;}
  if(d.bgblur){APP.settings.bgBlur=t.checked;save();applyTheme();return;}
  if(d.logo){const f=t.files&&t.files[0];if(!f)return;
    loadLogo(f).then(r=>{if(!r){toast("Couldn't read that image. Try a PNG or JPG.");return;}
      Object.assign(APP.settings,r);save();render();toast("Logo saved");});return;}
  if(d.bkphotos){APP.bkPhotos=t.checked;save();return;}
  if(d.invc){S.invoice[d.invc]=t.checked;save();refreshTotals();return;}
  if(d.lnk!==undefined){const k=+d.lnk,x=S.invoice.lines[k];x.k=t.value;if(x.k==="flat")x.q="1";if(x.k==="labor"&&!x.p&&APP.settings.laborRate)x.p=APP.settings.laborRate;save();render();refreshTotals();return;}
  if(d.set==="hq"){checkHQ();return;}
  if(d.exprc&&EXP_DRAFT){const f=t.files&&t.files[0];t.value="";if(!f)return;const dr=EXP_DRAFT;
    imgFromBlob(f).then(im=>{if(!im){toast("Couldn't read that photo");return;}const c=drawTo(im,im.naturalWidth,im.naturalHeight,1400);dr.rcData=c.toDataURL("image/jpeg",0.72);if(EXP_DRAFT===dr)rerenderKeep();});return;}
  if(d.exp==="jobId"&&EXP_DRAFT){EXP_DRAFT.jobId=t.value;return;}
  if(d.mkind){const [id,k]=d.mkind.split(":");const it=APP.settings.menu.find(x=>x.id===id);const x=it&&it.lines[+k];if(!x)return;x.k=t.value;if(x.k==="flat")x.q="1";save();rerenderKeep();return;}
  if(d.themecustom){save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(d.draft==="location"&&hasHQ()&&t.value.trim()){calcDist("draft",true);return;}
  if(d.info==="location"&&hasHQ()&&t.value.trim()&&S){calcDist("info",true);return;}
  if(d.set&&APP.view==="settings")return;
  if(d.media){const files=[...t.files];t.value="";if(!files.length)return;const job=S;
    addMediaFiles(job,files,d.media).then(({n,fail})=>{if(S===job){const y=window.scrollY;render();window.scrollTo(0,y);}
      toast(fail?`Saved ${n}, ${fail} couldn't be saved (phone storage may be full)`:`${n} ${d.media==="video"?"video":"photo"}${n===1?"":"s"} added`);});return;}
  if(!d.photo)return;const id=d.photo;
  const files=[...t.files];if(!files.length)return;
  Promise.all(files.map(shrink)).then(urls=>{res(id).photos.push(...urls.filter(Boolean));save();
    const el=document.querySelector(`[data-item="${id}"]`);if(el)el.outerHTML=renderItem(ALL_ITEMS.find(x=>x.id===id));toast(urls.length>1?`${urls.length} photos added`:"Photo added");});
});
function loadLogo(file){
  return new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,600/img.width,300/img.height);const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
    g.fillStyle="#ffffff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    resolve({logo:c.toDataURL("image/jpeg",0.9),logoW:w,logoH:h});};img.onerror=()=>resolve(null);img.src=fr.result;};fr.onerror=()=>resolve(null);fr.readAsDataURL(file);});
}
function shrink(file){
  return new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const max=900,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",0.6));};img.onerror=()=>resolve(null);img.src=fr.result;};fr.onerror=()=>resolve(null);fr.readAsDataURL(file);});
}
