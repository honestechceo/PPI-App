# Deploys the Supabase server functions whenever they change on main.
# Needs one repo secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy server functions
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: dvgjrqbrqvizbvszubdh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check CLI and token
        run: |
          supabase --version 2>&1 | sed 's/^/::notice::cli /'
          out=$(supabase projects list 2>&1) || { echo "$out" | tail -5 | sed 's/^/::error::/'; exit 1; }
      - name: Deploy billing
        run: |
          out=$(supabase functions deploy billing --project-ref "$PROJECT" --no-verify-jwt --use-api 2>&1) || { echo "$out" | tail -8 | sed 's/^/::error::/'; exit 1; }
      - name: Deploy stripe-webhook
        run: supabase functions deploy stripe-webhook --project-ref "$PROJECT" --no-verify-jwt --use-api
      - name: Deploy notify
        run: supabase functions deploy notify --project-ref "$PROJECT" --no-verify-jwt --use-api
      - name: Deploy intake
        run: supabase functions deploy intake --project-ref "$PROJECT" --no-verify-jwt --use-api
