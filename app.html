<title>Honestech Mobile Mechanic App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: field tool. Sticky header with progress + numbered step strip, one inspection stage per screen, big tap targets, fixed prev/next bar. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d5dbe2;
  --accent:#1d5fa8; --accent-ink:#ffffff; --accent-soft:#e2ecf8;
  --good:#1f7a45; --good-soft:#e1f2e8; --mon:#9a6200; --mon-soft:#fbf0d9; --bad:#b42323; --bad-soft:#fbe4e4; --na:#6b7480; --na-soft:#eceff2;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3744;
  --accent:#5c9be0; --accent-ink:#0b1622; --accent-soft:#1b2c40;
  --good:#5cc489; --good-soft:#163024; --mon:#e3a93d; --mon-soft:#33280f; --bad:#f07070; --bad-soft:#3a1a1a; --na:#9aa4ae; --na-soft:#222c36;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --ink:#e6ebf0; --muted:#97a3b0; --line:#2b3744;
  --accent:#5c9be0; --accent-ink:#0b1622; --accent-soft:#1b2c40;
  --good:#5cc489; --good-soft:#163024; --mon:#e3a93d; --mon-soft:#33280f; --bad:#f07070; --bad-soft:#3a1a1a; --na:#9aa4ae; --na-soft:#222c36;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:760px;margin:0 auto;padding:10px 16px 0;position:relative}
.saved{flex:0 0 auto;align-self:center;font-size:11px;color:var(--muted);opacity:.85;transition:color .3s}
.saved.flash{color:var(--good)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand{align-items:center}
.brand h1{flex:1;min-width:0}
.brand h1 .b2{color:var(--accent);white-space:nowrap}
.brand h1 small{font-size:.6em;letter-spacing:.12em;margin-left:2px;color:var(--muted);vertical-align:middle}
.brand-r{flex:0 0 auto}
@media (max-width:560px){.brand h1{font-size:18px;line-height:1.05}.brand h1 .b1,.brand h1 .b2{display:block}}

.brand .veh{font-size:13px;color:var(--muted);text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 6px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--na-soft);font-family:var(--f-mono);font-size:11px;color:var(--ink)}
.step.done b{background:var(--good);color:var(--surface)}
.step.flag b{background:var(--bad);color:var(--surface)}
.step.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.sample{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--mon-soft);border:1px solid var(--mon);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.stage-head{margin:4px 0 14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stage-head h2{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;margin:2px 0 6px;text-wrap:balance}
.when{color:var(--muted);max-width:62ch;margin:0}
.when strong{color:var(--ink)}

.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px}
.item[data-r="good"]{border-left-color:var(--good)}
.item[data-r="mon"]{border-left-color:var(--mon)}
.item[data-r="bad"]{border-left-color:var(--bad)}
.item[data-r="na"]{border-left-color:var(--na)}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-label{font-weight:600;min-width:0}
.item-hint{color:var(--muted);font-size:13px;margin-top:2px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;font-weight:600;font-size:14px;min-height:44px}
.rate button[aria-pressed="true"][data-v="good"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.rate button[aria-pressed="true"][data-v="mon"]{background:var(--mon-soft);border-color:var(--mon);color:var(--mon)}
.rate button[aria-pressed="true"][data-v="bad"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.rate button[aria-pressed="true"][data-v="na"]{background:var(--na-soft);border-color:var(--na);color:var(--na)}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.meas{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.meas input{width:72px;border:0;background:transparent;padding:8px 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.meas span{font-size:13px;color:var(--muted);white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.mini input[type=file]{display:none}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:12px}
.axle{grid-column:1/-1;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.corner{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);min-width:0}
.corner[data-cr="good"]{border-left-color:var(--good)} .corner[data-cr="mon"]{border-left-color:var(--mon)} .corner[data-cr="bad"]{border-left-color:var(--bad);background:var(--bad-soft)}
.cname{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);width:22px}
.corner input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:11px 0;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.cunit{font-size:12px;color:var(--muted)}
.note{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px;resize:vertical}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs figure{margin:0;position:relative;width:72px;height:72px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:13px;line-height:1}

.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);width:100%}
.form input.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.vinmsg{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0}
.vinmsg.ok{color:var(--good)} .vinmsg.err{color:var(--bad)}
.subh{font-family:var(--f-display);font-size:22px;font-weight:700;margin:6px 0 10px}

nav.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.foot-inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.foot .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.rep-head h3{font-family:var(--f-display);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.rep-head .biz{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:14px 0}
.kv div{min-width:0}
.kv dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--f-mono);font-weight:500}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tally div{border-radius:8px;padding:10px;text-align:center}
.tally strong{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-size:12px}
.t-good{background:var(--good-soft);color:var(--good)} .t-mon{background:var(--mon-soft);color:var(--mon)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-open{background:var(--na-soft);color:var(--na)}
.verdict{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.verdict .opts{display:flex;flex-wrap:wrap;gap:6px}
.verdict button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px}
.verdict button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rep-sec{margin-top:18px}
.rep-sec h4{font-family:var(--f-display);font-size:20px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em}
.rep-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rep-list li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.rep-list li:last-child{border-bottom:0}
.pill{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;min-width:64px;text-align:center}
.p-good{background:var(--good-soft);color:var(--good)} .p-mon{background:var(--mon-soft);color:var(--mon)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-na{background:var(--na-soft);color:var(--na)}
.rep-list .txt{min-width:0}
.rep-list .txt small{display:block;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.copyrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;pointer-events:none}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
textarea.copybox{width:100%;min-height:160px;margin-top:10px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px}
@media (max-width:480px){
  .form{grid-template-columns:minmax(0,1fr)}
  .stage-head h2{font-size:28px}
  .tally strong{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* app shell: schedule, settings, invoice */
.brand-r{display:flex;gap:6px;align-items:center;min-width:0}
.navbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.jobbar{display:flex;align-items:center;gap:8px;padding:8px 0 0;min-width:0}
.jobbar .veh{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;margin:0 -2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day strong{font-family:var(--f-display);font-size:22px;line-height:1}
.day i{width:6px;height:6px;border-radius:50%;background:transparent;font-style:normal}
.day.has i{background:var(--accent)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day.all{width:auto;padding:6px 12px;justify-content:center}
.group-h{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.jobs{display:flex;flex-direction:column;gap:10px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px}
.job .when-col{grid-row:span 3;border-right:1px solid var(--line);padding-right:10px}
.job .t{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.job .d{font-size:12px;color:var(--muted)}
.job .who{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.job .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.job .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.st-sched{background:var(--accent-soft);color:var(--accent)} .st-active{background:var(--mon-soft);color:var(--mon)} .st-done{background:var(--na-soft);color:var(--na)} .st-paid{background:var(--good-soft);color:var(--good)} .st-unpaid{background:var(--bad-soft);color:var(--bad)}
.mini.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini.del{color:var(--bad)}
.emptybox{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.formh{grid-column:1/-1;font-family:var(--f-display);font-size:20px;font-weight:700;margin:0}
.formacts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.help{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.check{flex-direction:row!important;align-items:center;gap:10px!important;text-transform:none!important;letter-spacing:0!important;font-size:15px!important;color:var(--ink)!important;font-weight:500!important}
.check input{width:22px!important;height:22px}
/* invoice */
.inv-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.inv-table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 0;border-bottom:1px solid var(--line)}
.inv-table th:last-child,.inv-table td.amt{text-align:right}
.inv-table td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.inv-table td.amt{width:120px}
.inv-table input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 8px;width:100%}
.inv-table td.amt input{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inv-table .sub{display:block;font-size:12px;color:var(--muted)}
.rowx{display:flex;gap:6px;align-items:center}
.rowx input.dist{width:70px}
.xbtn{border:0;background:transparent;color:var(--bad);font-size:18px;padding:4px 8px}
.totals{margin-top:10px;margin-left:auto;max-width:280px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.totals dt{color:var(--muted)}
.totals dd{margin:0;text-align:right;font-family:var(--f-mono)}
.totals .grand{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--ink)}
.paybox{margin-top:16px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);white-space:pre-line;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.paidstamp{display:inline-block;border:2px solid var(--good);color:var(--good);font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.1em;padding:2px 10px;border-radius:6px;transform:rotate(-4deg)}
.logo-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-box{width:120px;height:72px;border:1px dashed var(--line);border-radius:10px;background:#ffffff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.logo-box img{max-width:108px;max-height:60px;object-fit:contain}
.logo-box span{font-size:12px;color:#6b7480}
.logo-acts{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.mini input[type=file]{display:none}
.rep-id{display:flex;gap:12px;align-items:center;min-width:0}
.rep-logo{max-height:52px;max-width:120px;object-fit:contain;border-radius:6px;background:#ffffff;padding:4px}
.dl-note{display:none}
.no-dl .dl-note{display:block}
.no-dl .dl-only{display:none!important}
.ck-sec{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ck-sec summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;list-style:none}
.ck-sec summary::-webkit-details-marker{display:none}
.ck-sec summary::after{content:"＋";color:var(--muted);font-weight:400}
.ck-sec[open] summary::after{content:"−"}
.ck-sec summary small{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.ck-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ck-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ck-row.off .ck-label{color:var(--muted);text-decoration:line-through}
.ck-label{min-width:0;font-size:14px;color:var(--ink)}
.ck-label small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px;vertical-align:middle}
.ck-tog{min-width:76px;justify-content:center}
.ck-tog[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.ck-addwrap{border:0;border-radius:0;margin:0;background:transparent;padding:12px}

  {id:"arrive", title:"Arrival & Documents", when:"<strong>Before anyone starts the car.</strong> Touch the hood and upper radiator hose to confirm the engine is cold, then match paperwork to the vehicle.",

      const rows=await supa(q);if(!rows||!rows.length)break;
      rows.forEach(r=>{const k=r.kind+":"+r.id;SMETA.cursor=r.updated_at;
        if(dirty(k)&&!(first&&r.kind==="settings"))return;          // keep my newer edit; it gets pushed below
        if(!(k in lh)&&k in SMETA.h&&!r.deleted)return;               // I deleted it here; the delete gets pushed below
        const c=applyRemote(r);changed+=c;if(k in lh||r.deleted)delete lh[k];});
      saveMeta();if(rows.length<500)break;}
    // 2) push what changed here (and deletions)
    const now=localRecords(),seen=new Set(),push=[];
    now.forEach(r=>{const k=r.kind+":"+r.id;seen.add(k);const hh=h32(JSON.stringify(r.data));if(SMETA.h[k]!==hh)push.push({row:{shop_id:shopId,kind:r.kind,id:r.id,data:r.data,deleted:false},k,hh});});
    Object.keys(SMETA.h).forEach(k=>{if(!seen.has(k)&&!k.startsWith("settings:")){const [kind,...rest]=k.split(":");push.push({row:{shop_id:shopId,kind,id:rest.join(":"),data:{},deleted:true},k,hh:null});}});
    for(let i=0;i<push.length;i+=25){const chunk=push.slice(i,i+25);
      await supa("/rest/v1/records?on_conflict=shop_id,kind,id",{method:"POST",body:chunk.map(x=>x.row),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}});
      chunk.forEach(x=>{if(x.hh)SMETA.h[x.k]=x.hh;else delete SMETA.h[x.k];});saveMeta();}
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(APP));}catch(e){}rebuildChecklist(APP.settings);const y=window.scrollY;if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){render();window.scrollTo(0,y);}}
    if(!PLAN||Date.now()-(PLAN.at||0)>10*60000||PLAN.shop_id!==AUTH.shop_id)await fetchPlan();
    SYNC.state="ok";SYNC.err="";SYNC.last=Date.now();SMETA.lastAt=SYNC.last;saveMeta();
  }catch(e){SYNC.state=e.code==="offline"?"offline":e.code==="signedout"?"off":"error";SYNC.err=e.msg||"Sync failed";}
  finally{SYNC.busy=false;syncLabel();if(SYNC.again){SYNC.again=false;scheduleSync();}}
}
function applyRemote(r){
  const k=r.kind+":"+r.id,mapK={job:"jobs",customer:"customers",expense:"expenses",trip:"trips",request:"requests"}[r.kind];
  if(r.kind==="settings"){if(r.deleted)return 0;const hh=h32(JSON.stringify(r.data));if(SMETA.h[k]===hh)return 0;const ns={...defaultSettings(),...r.data};Object.keys(APP.settings).forEach(x=>{if(!(x in ns))delete APP.settings[x];});Object.assign(APP.settings,ns);SMETA.h[k]=hh;return 1;}
  if(!mapK)return 0;const arr=APP[mapK]||(APP[mapK]=[]);const i=arr.findIndex(x=>String(x.id)===String(r.id));
  if(r.deleted){if(i>-1){arr.splice(i,1);if(APP.active===r.id&&APP.view==="job"){APP.view="jobs";}}delete SMETA.h[k];return i>-1?1:0;}
  const hh=h32(JSON.stringify(r.data));if(SMETA.h[k]===hh&&i>-1)return 0;
  if(i>-1){const o=arr[i];Object.keys(o).forEach(x=>delete o[x]);Object.assign(o,r.data);}else arr.push(r.data);SMETA.h[k]=hh;return 1;
}

const JOB_CATS=[["Front brakes",/front.{0,25}(brake|pad|rotor)|(brake|pad|rotor).{0,25}front/i],["Rear brakes",/rear.{0,25}(brake|pad|rotor|shoe|drum)|(brake|pad|rotor|shoe|drum).{0,25}rear/i],
  ["Brakes",/brake|pads?\b|rotors?\b|caliper/i],["Oil change",/oil (and|&) filter|oil change|\boil\b.{0,10}service|\blof\b/i],["Battery",/battery/i],["Alternator",/alternator/i],["Starter",/starter/i],
  ["Spark plugs",/spark plug|tune.?up|ignition coil|coil pack/i],["Serpentine belt",/serpentine|drive belt|belt tensioner/i],["Diagnosis",/diagnos|check engine|cel\b|scan|no.?start|won'?t start|electrical/i],
  ["Coolant / thermostat",/coolant|thermostat|radiator|overheat|water pump/i],["Fluid service",/fluid (flush|service|exchange)|brake fluid|power steering fluid/i],["Sensor",/sensor|o2|oxygen|map sensor|maf/i],["Suspension",/strut|shock|control arm|sway|tie rod|ball joint/i],
  ["Pre-purchase inspection",/pre-?purchase|\bppi\b/i]];
function jobCat(j){if(!isSvc(j))return "Pre-purchase inspection";if(j.menuName){const c=JOB_CATS.find(([n,re])=>re.test(j.menuName));return c?c[0]:j.menuName;}
  const txt=[j.info.work,(j.invoice.lines||[]).map(x=>x.d).join(" ")].join(" ");const c=JOB_CATS.find(([n,re])=>re.test(txt));return c?c[0]:"";}
const tmrHours=j=>{const t=j.timer;if(!t)return 0;let ms=(t.segs||[]).reduce((a,x)=>a+(x.e-x.s),0);if(t.run)ms+=Date.now()-t.run;return ms/3600000;};
const jobHours=j=>num(j.actualHrs)||(j.timer?Math.round(tmrHours(j)*10)/10:0);
function catStats(cat,exceptId){if(!cat)return null;const js=APP.jobs.filter(j=>j.id!==exceptId&&j.status==="done"&&jobCat(j)===cat&&jobHours(j)>0);
  if(!js.length)return null;const hs=js.map(jobHours).sort((a,b)=>a-b);const avg=hs.reduce((a,h)=>a+h,0)/hs.length;
  const billed=js.reduce((a,j)=>{const t=totals(j);return a+(t.svc?t.labor:t.fee)-(t.disc||0)*0;},0),hrs=hs.reduce((a,h)=>a+h,0);
  return {cat,n:js.length,avg:Math.round(avg*10)/10,min:hs[0],max:hs[hs.length-1],rate:hrs?billed/hrs:0};}
const fmtHM=h=>{const m=Math.round(h*60);return m<60?`${m} min`:`${Math.floor(m/60)} hr ${String(m%60).padStart(2,"0")} min`;};
function timerHTML(){
  const t=S.timer||{segs:[]},run=!!t.run,h=tmrHours(S),cat=jobCat(S),st=catStats(cat,S.id),done=S.status==="done";
  return `<div class="form tmr-card" id="tmrCard"><p class="formh">⏱ Job time</p>
    <div class="full tmr-row"><strong class="tmr-clock${run?" on":""}" id="tmrClock">${h?fmtHM(h):"0 min"}</strong>

    <div class="tmr-use">${jobHours(S)?`<button class="mini" type="button" data-tmr="uselabor">Use ${jobHours(S)} hr on the labor line</button>`:""}</div>
    <div class="full tmr-avg">${cat?(st?`<strong>Your average for ${esc(cat)}: ${st.avg} hr</strong> <span class="help">(${st.n} job${st.n===1?"":"s"} · fastest ${st.min.toFixed(1)}, longest ${st.max.toFixed(1)}${st.rate?` · your labor earns about ${money(st.rate)}/hr on these`:""})</span>${done?"":` <button class="mini" type="button" data-tmr="useavg">Use ${st.avg} hr</button>`}`
      :`<span class="help">First ${esc(cat)} job with a time. Your average shows here after you finish it.</span>`):`<span class="help">Add the work above (or pick from your service menu) and the app will track your average time for this kind of job.</span>`}</div>
  </div>`;
}
let TMR_IV=null;
function tickTimer(){clearInterval(TMR_IV);if(!S||!S.timer||!S.timer.run)return;TMR_IV=setInterval(()=>{const el=document.getElementById("tmrClock");if(!el||!S||!S.timer||!S.timer.run){clearInterval(TMR_IV);return;}el.textContent=fmtHM(tmrHours(S));},15000);}
function jobTimesHTML(){
  const cats=[...new Set(APP.jobs.filter(j=>j.status==="done"&&jobHours(j)>0).map(jobCat).filter(Boolean))].map(c=>catStats(c)).filter(Boolean).sort((a,b)=>b.n-a.n).slice(0,8);

}

let SIG_DRAWN=false;
function initSigPad(){
  const cv=document.getElementById("sigCv");if(!cv)return;SIG_DRAWN=false;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.fillStyle="#fff";g.fillRect(0,0,w,h);g.lineWidth=2.4;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#111";
  let last=null;const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);last=pt(e);g.beginPath();g.arc(last[0],last[1],1.1,0,7);g.fillStyle="#111";g.fill();SIG_DRAWN=true;};
  cv.onpointermove=e=>{if(!last)return;e.preventDefault();const p=pt(e);g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p;SIG_DRAWN=true;};
  cv.onpointerup=cv.onpointercancel=()=>{last=null;};
}

let ROUTE=null; // {day,state,order:[{j,lat,lon,leg}],start,total,missing}
async function planRoute(day,useHere){
  const js=APP.jobs.filter(j=>j.info.date===day&&j.status!=="done");
  ROUTE={day,state:"loading",n:js.length,done:0};rerenderKeep();
  let start=null,startName="";
  if(useHere){const h=await herePos();if(h){start=h;startName="Your location";}}
  if(!start&&hasHQ()){start={lat:APP.settings.hqLat,lon:APP.settings.hqLon};startName="Home base";}
  const pts=[],missing=[];
  for(const j of js){if(!j.info.location){missing.push(j);continue;}
    const cached=APP.geo&&APP.geo[j.info.location.trim().toLowerCase().replace(/\s+/g," ")];
    const g=cached||await geocode(j.info.location).catch(()=>null);if(!cached)await new Promise(r=>setTimeout(r,1100));
    if(g)pts.push({j,lat:g.lat,lon:g.lon});else missing.push(j);
    if(ROUTE&&ROUTE.day===day){ROUTE.done++;const el=document.getElementById("routeProg");if(el)el.textContent=`Finding ${ROUTE.done} of ${js.length} addresses…`;}}
  if(!ROUTE||ROUTE.day!==day)return;
  const order=[];let cur=start||(pts[0]&&{lat:pts[0].lat,lon:pts[0].lon});const left=[...pts];let total=0;
  while(left.length){let bi=0,bd=Infinity;left.forEach((p,k)=>{const dd=crowMiles(cur,p);if(dd<bd){bd=dd;bi=k;}});const p=left.splice(bi,1)[0];const leg=Math.round(bd*1.25*10)/10;
    order.push({...p,leg:start||order.length?leg:0});total+=start||order.length>1?leg:0;cur=p;}
  save();ROUTE={day,state:"ready",order,start,startName,total:Math.round(total*10)/10,missing};rerenderKeep();
}
function routeHTML(){
  if(!ROUTE)return "";
  if(ROUTE.state==="loading")return `<div class="route-box"><strong>🗺 Planning the route…</strong><p class="help" id="routeProg" style="margin:0">Finding addresses on the map…</p></div>`;
  const o=ROUTE.order,timed=o.some(x=>x.j.info.time);
  const gUrl=o.length?`https://www.google.com/maps/dir/?api=1${ROUTE.start?`&origin=${ROUTE.start.lat},${ROUTE.start.lon}`:""}&destination=${encodeURIComponent(o[o.length-1].j.info.location)}${o.length>1?`&waypoints=${encodeURIComponent(o.slice(0,-1).map(x=>x.j.info.location).join("|"))}`:""}&travelmode=driving`:"";
  return `<div class="route-box"><div class="dc-h"><h3 style="margin:0">🗺 Best driving order</h3><button class="xbtn" type="button" data-act="routeclose" aria-label="Close route">×</button></div>
    <p class="help" style="margin:0">${esc(fmtDate(ROUTE.day,{weekday:"long",month:"short",day:"numeric"}))} · starting from ${esc(ROUTE.startName||"the first job")} · about ${ROUTE.total} mi of driving</p>
    <ol class="route-list">${o.map((x,k)=>`<li><span class="rt-n">${k+1}</span><span class="rt-w"><strong>${esc(x.j.info.customer||"Job")}</strong>${x.j.info.time?` <span class="tag">${esc(fmtTime(x.j.info.time))}</span>`:""}<small>${esc(x.j.info.location)}${x.leg?` · ~${x.leg} mi`:""}</small></span>${dirLink(x.j.info.location)}</li>`).join("")}</ol>
    ${ROUTE.missing.length?`<p class="help vin-warn" style="margin:0">Not on the route (no address found): ${esc(ROUTE.missing.map(j=>j.info.customer||"job").join(", "))}</p>`:""}
    ${timed?`<p class="help" style="margin:0">Your booked times aren't changed. Use this order to plan, or call customers to adjust.</p>`:""}
    <div class="acts">${gUrl?`<a class="btn primary" href="${esc(gUrl)}" target="_blank" rel="noopener">Open full route in Google Maps</a>`:""}</div></div>`;
}

const jDate=j=>(j.invoice&&j.invoice.date)||j.info.date||"";
function periodStart(p){const d=new Date(TODAY+"T12:00:00");
  if(p==="week"){const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);}else if(p==="year"){d.setMonth(0,1);}else d.setDate(1);
  return isoDay(d);}
function breakdown(js){
  const b={Inspections:0,Labor:0,Parts:0,Fees:0,Travel:0,Tax:0};
  js.forEach(j=>{const t=totals(j);if(t.svc){b.Labor+=t.labor;b.Parts+=t.parts;b.Fees+=t.fees;}else{b.Inspections+=t.fee+t.extras;}b.Travel+=t.travel.fee;b.Tax+=t.tax;});
  return b;
}

function barChart(vals){
  const W=600,H=230,padL=84,padR=8,top=20,bot=36,max=Math.max(1,...vals.map(v=>v.v)),bw=(W-padL-padR)/vals.length;
  const nice=(()=>{const raw=max;const p=Math.pow(10,Math.floor(Math.log10(raw)));const m=raw/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p;})();
  const y=v=>top+(H-top-bot)*(1-v/nice);
  const grid=[0.5,1].map(f=>`<line x1="${padL}" x2="${W-padR}" y1="${y(nice*f).toFixed(1)}" y2="${y(nice*f).toFixed(1)}" class="gl"/><text x="${padL-10}" y="${(y(nice*f)+7).toFixed(1)}" class="gt" text-anchor="end">${money(nice*f).replace(".00","")}</text>`).join("");
  const bars=vals.map((v,k)=>{const x=padL+k*bw+bw*0.2,w=bw*0.6,h=Math.max(0,(H-bot)-y(v.v)),cur=k===vals.length-1;
    const r=Math.min(4,w/2,h);const yy=y(v.v);
    const path=h>0?`M${x},${H-bot} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+w-r} Q${x+w},${yy} ${x+w},${yy+r} V${H-bot} Z`:"";
    return `<g class="bar${cur?" cur":""}" data-bar="${k}" data-cap="${esc(fmtDate(v.m+"-01",{month:"long"}))}: ${money(v.v)} · ${v.n} job${v.n===1?"":"s"}">
      <rect x="${padL+k*bw}" y="${top}" width="${bw}" height="${H-top}" fill="transparent"/>${path?`<path d="${path}"/>`:""}
      <text x="${x+w/2}" y="${H-10}" text-anchor="middle" class="bt">${esc(new Date(v.m+"-01T12:00:00").toLocaleDateString(undefined,{month:"short"}))}</text><title>${esc(fmtDate(v.m+"-01",{month:"long",year:"numeric"}))}: ${money(v.v)}</title></g>`;}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Billed per month, last 6 months">${grid}<line x1="${padL}" x2="${W-padR}" y1="${H-bot}" y2="${H-bot}" class="axis"/><text x="${padL-10}" y="${H-bot+7}" class="gt" text-anchor="end">$0</text>${bars}</svg>
  <table class="sr-only"><caption>Billed per month</caption>${vals.map(v=>`<tr><th>${esc(v.m)}</th><td>${money(v.v)}</td></tr>`).join("")}</table>`;
}

/* ================= customers ================= */
/* Built automatically from jobs; kept even after a job is deleted. */
const digits=s=>String(s||"").replace(/\D/g,"");
const normName=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const vehKey=v=>(v.vin&&v.vin.length>=11)?"vin:"+v.vin.toUpperCase():"ymm:"+[v.year,v.make,v.model].map(x=>normName(x)).join("|");
const vehName=v=>[v.year,v.make,v.model,v.trim].filter(Boolean).join(" ");
function findCustomer(info){
  const cs=APP.customers||[],ph=digits(info.phone),nm=normName(info.customer);
  return (ph.length>=7&&cs.find(c=>!c.hidden&&digits(c.phone)===ph))||(nm&&cs.find(c=>!c.hidden&&normName(c.name)===nm))||null;
}
function syncCustomers(){
  if(!APP||!APP.jobs)return;
  const cs=APP.customers||(APP.customers=[]);
  const byId=Object.fromEntries(cs.map(c=>[c.id,c]));
  const jobs=[...APP.jobs].sort((a,b)=>((a.info.date||"")<(b.info.date||"")?-1:1));
  for(const j of jobs){
    const i=j.info;if(!normName(i.customer))continue;
    let c=j.custId&&byId[j.custId];
    if(!c){c=findCustomer(i);if(!c){c={id:"c"+uid(),name:"",phone:"",email:"",location:"",dist:"",notes:"",vehicles:[],last:""};cs.push(c);}byId[c.id]=c;j.custId=c.id;}
    if(!c.last||(i.date||"")>=c.last){
      c.name=i.customer.trim();if(i.phone)c.phone=i.phone;if(i.location)c.location=i.location;if(i.dist)c.dist=i.dist;c.last=i.date||c.last;
    }
    if(i.make||i.model||i.vin){
      const v={year:i.year||"",make:i.make||"",model:i.model||"",trim:i.trim||"",vin:i.vin||"",miles:i.miles||"",color:i.color||""},k=vehKey(v);
      let ex=c.vehicles.find(x=>x.key===k)||(v.vin&&c.vehicles.find(x=>!x.vin&&x.key===vehKey({...v,vin:""})));
      if(ex){for(const f of ["year","make","model","trim","vin","color"])if(v[f])ex[f]=v[f];if(v.miles&&num(v.miles)>=num(ex.miles))ex.miles=v.miles;ex.key=vehKey(ex);}
      else c.vehicles.push({...v,key:k});
    }
  }
}
const custJobs=c=>APP.jobs.filter(j=>j.custId===c.id).sort((a,b)=>((a.info.date||"")>(b.info.date||"")?-1:1));
function custMatches(q,limit=6){
  q=String(q||"").trim();if(q.length<2)return [];
  const nq=normName(q),dq=digits(q),rows=[];
  for(const c of (APP.customers||[])){
    if(c.hidden)continue;
    const hit=normName(c.name).includes(nq)||(dq.length>=3&&digits(c.phone).includes(dq));
    if(!hit)continue;
    if(c.vehicles.length)c.vehicles.forEach(v=>rows.push({c,v}));
    rows.push({c,v:null});
    if(rows.length>=limit)break;
  }
  return rows.slice(0,limit);
}
function sugHTML(target,q){
  const rows=custMatches(q);if(!rows.length)return "";
  return rows.map(({c,v})=>`<button type="button" class="sug-row" data-sugpick="${c.id}|${v?v.key:""}|${target}">
    <strong>${esc(c.name)}</strong><span>${esc(v?vehName(v):(c.vehicles.length?"Another vehicle":"No vehicle saved"))}${c.phone?" · "+esc(c.phone):""}</span></button>`).join("");
}
function fillFromCustomer(obj,c,v,withVehicle=true){
  Object.assign(obj,{customer:c.name,phone:c.phone||"",location:c.location||"",dist:c.dist||""});
  if(withVehicle){const e={year:"",make:"",model:"",trim:"",vin:"",miles:"",color:""};Object.assign(obj,e,v?{year:v.year,make:v.make,model:v.model,trim:v.trim,vin:v.vin,color:v.color}:{});}
}

const hasHQ=()=>!!(APP.settings.hq&&APP.settings.hqLat!=null&&APP.settings.hqFor===APP.settings.hq.trim());
async function geocode(addr){
  const q=String(addr||"").trim();if(!q)return null;
  const key=q.toLowerCase().replace(/\s+/g," ");APP.geo=APP.geo||{};
  if(APP.geo[key])return APP.geo[key];
  const cc=APP.settings.hqCC&&key!==String(APP.settings.hq||"").trim().toLowerCase().replace(/\s+/g," ")?"&countrycodes="+APP.settings.hqCC:"";
  let hit=null;
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1${cc}&q=${encodeURIComponent(q)}`,{headers:{"Accept-Language":"en"}});
    const a=await r.json();if(a&&a[0])hit={lat:+a[0].lat,lon:+a[0].lon,cc:(a[0].address&&a[0].address.country_code)||"",name:a[0].display_name||""};}catch(e){}
  if(!hit){try{const bias=APP.settings.hqLat!=null?`&lat=${APP.settings.hqLat}&lon=${APP.settings.hqLon}`:"";
    const r=await fetch(`https://photon.komoot.io/api/?limit=1&lang=en${bias}&q=${encodeURIComponent(q)}`);const a=await r.json();const f=a&&a.features&&a.features[0];
    if(f){const pr=f.properties||{};hit={lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],cc:(pr.countrycode||"").toLowerCase(),name:[pr.name,pr.street,pr.city,pr.state].filter(Boolean).join(", ")};}}catch(e){}}
  if(hit){const ks=Object.keys(APP.geo);if(ks.length>300)delete APP.geo[ks[0]];APP.geo[key]=hit;}
  return hit;
}
function crowMiles(a,b){const R=3958.8,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);
  const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
async function distFromHQ(addr){
  if(!hasHQ())return {err:"nohq"};
  const to=await geocode(addr);if(!to)return {err:"notfound"};
  const from={lat:APP.settings.hqLat,lon:APP.settings.hqLon};
  try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=false`);
    const j=await r.json();const rt=j&&j.routes&&j.routes[0];
    if(rt)return {mi:Math.round(rt.distance/160.9344)/10,min:Math.round(rt.duration/60),road:true};}catch(e){}
  return {mi:Math.round(crowMiles(from,to)*1.25*10)/10,road:false};
}

async function calcDist(target,quiet){

const VIN_DEC={};let VINMSG=null; // {id,vin,html}

async function decodeVin(vin){
  vin=String(vin||"").toUpperCase();if(VIN_DEC[vin])return VIN_DEC[vin];
  const r=await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${encodeURIComponent(vin)}?format=json`);
  const j=await r.json();const x=j&&j.Results&&j.Results[0];if(!x)return null;
  const c=v=>{v=String(v==null?"":v).trim();return /^(not applicable|null|0)$/i.test(v)?"":v;};
  const disp=c(x.DisplacementL)&&parseFloat(x.DisplacementL)>0?(Math.round(parseFloat(x.DisplacementL)*10)/10).toFixed(1)+"L":"";
  const cyl=c(x.EngineCylinders),cfg=c(x.EngineConfiguration);
  const cylS=cyl?(/^V/i.test(cfg)?"V"+cyl:/in-?line/i.test(cfg)?"I"+cyl:/flat|horizontal/i.test(cfg)?"H"+cyl:cyl+"-cyl"):"";
  const fuel=c(x.FuelTypePrimary),elec=c(x.ElectrificationLevel);
  const engine=[disp,cylS,/diesel/i.test(fuel)?"Diesel":"",/hybrid/i.test(elec)?"Hybrid":"",(/electric/i.test(fuel)&&!disp)?"Electric":"",c(x.Turbo)&&/yes/i.test(x.Turbo)?"Turbo":""].filter(Boolean).join(" ");
  const d={year:c(x.ModelYear),make:titleMake(c(x.Make)),model:c(x.Model),trim:c(x.Trim)||c(x.Series),engine,drive:(c(x.DriveType).split("/")[0]||"").trim()};
  if(!d.make&&!d.model)return null;
  VIN_DEC[vin]=d;return d;
}

function vinCheck(v){
  v=(v||"").toUpperCase().replace(/\s/g,"");
  if(!v) return {cls:"",msg:""};
  if(/[IOQ]/.test(v)) return {cls:"err",msg:"VINs never contain I, O, or Q"};
  if(v.length!==17) return {cls:"err",msg:`${v.length} of 17 characters`};
  const map={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
  const w=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
  let sum=0;for(let i=0;i<17;i++){const c=v[i];const n=/\d/.test(c)?+c:map[c];if(n===undefined)return{cls:"err",msg:"Invalid character"};sum+=n*w[i]}
  const cd=sum%11===10?"X":String(sum%11);
  return cd===v[8]?{cls:"ok",msg:"Check digit valid"}:{cls:"err",msg:`Check digit fails (expected ${cd} in position 9). Re-read the VIN.`};
}

function travelCalc(job){
  const st=APP.settings, inv=job.invoice;
  if(inv.travelOverride!==""&&inv.travelOverride!=null) return {fee:num(inv.travelOverride),auto:false};
  const d=num(job.info.dist), billable=Math.max(0,d-num(st.freeMiles));
  return {fee:Math.round(billable*num(st.perMile)),auto:true,billable,d};
}

function discAmt(inv,pre){const d=inv.disc;if(!d||!num(d.v))return 0;
  const a=d.t==="pct"?Math.round(pre*Math.min(100,num(d.v)))/100:num(d.v);return Math.max(0,Math.min(pre,Math.round(a*100)/100));}

      <input id="disc-v" data-disc="v" inputmode="decimal" value="${esc(d.v||"")}" placeholder="${d.t==="pct"?"10":"25.00"}" aria-label="Discount ${d.t==="pct"?"percent":"amount"}">

function totals(job){
  const inv=job.invoice, st=APP.settings;
  if(isSvc(job)){
    const ls=inv.lines||[],sum=k=>ls.filter(x=>x.k===k).reduce((a,x)=>a+lineAmt(x),0);
    const labor=sum("labor")+sum("flat"),parts=sum("part"),fees=sum("fee"),tr=travelCalc(job);
    const pre=labor+parts+fees+tr.fee,disc=discAmt(inv,pre),sub=Math.round((pre-disc)*100)/100;
    const taxOn=inv.tax==null?!!st.taxOn:inv.tax;
    const tax=taxOn?Math.round(sub*num(st.taxRate))/100:0;
    return {svc:true,fee:0,labor,parts,fees,travel:tr,extras:labor+parts+fees,pre,disc,discLabel:discLabel(inv),sub,taxOn,tax,total:sub+tax};
  }
  const fee=inv.fee==null?num(st.fee):num(inv.fee);
  const tr=travelCalc(job);
  const extras=inv.items.reduce((a,x)=>a+num(x.a),0);
  const pre=fee+tr.fee+extras,disc=discAmt(inv,pre),sub=Math.round((pre-disc)*100)/100;
  const taxOn=inv.tax==null?!!st.taxOn:inv.tax;
  const tax=taxOn?Math.round(sub*num(st.taxRate))/100:0;
  return {fee,travel:tr,extras,pre,disc,discLabel:discLabel(inv),sub,taxOn,tax,total:sub+tax};
}

const OMW_DEFAULT="Hi {first}, this is {tech} from {business}. I'm on my way and should arrive around {eta} (about {minutes} min). See you soon!";

function omwText(j,mins){
  const i=j.info,st=APP.settings,first=(i.customer||"").trim().split(/\s+/)[0]||"there";
  const eta=new Date(Date.now()+mins*60000);
  const etaS=eta.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  const who=(i.tech||st.owner||"").trim();
  let t=(st.omwTpl||OMW_DEFAULT).replace(/\{first\}/g,first).replace(/\{tech\}/g,who||"your mechanic").replace(/\{business\}/g,bizName())
    .replace(/\{eta\}/g,etaS).replace(/\{minutes\}/g,String(mins)).replace(/\{vehicle\}/g,vehOf(i)||"vehicle");

function herePos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),()=>res(null),{enableHighAccuracy:false,timeout:9000,maximumAge:120000});});}
async function driveMins(from,addr){
  const to=await geocode(addr);if(!to)return null;
  try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=false`);
    const j=await r.json();const rt=j&&j.routes&&j.routes[0];if(rt)return Math.max(5,Math.round(rt.duration/60*1.1));}catch(e){}
  return Math.max(5,Math.round(crowMiles(from,to)*1.3/35*60)); // rough: 35 mph average
}
async function startOMW(id){

const hex2rgb=h=>{h=(h||"").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return h.length!==6||isNaN(n)?null:[n>>16&255,n>>8&255,n&255];};

function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return [h,s,l];}
function hsl2rgb([h,s,l]){if(!s)return [l*255,l*255,l*255];const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;

function backupText(){
  const copy=JSON.parse(JSON.stringify(APP));
  delete copy.adding;delete copy.draft;delete copy.editing;delete copy.confirmDel;delete copy.snaps;delete copy.snapAt;
  if(!APP.bkPhotos)copy.jobs.forEach(j=>Object.values(j.results).forEach(r=>{r.photos=[]}));
  // Letters, digits, - and _ only, so Notes, email and texts can't scramble it.
  const bytes=new TextEncoder().encode(JSON.stringify(copy));
  let bin="";for(let k=0;k<bytes.length;k+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(k,k+8192));
  return "HONESTECH-PPI-BACKUP-V2-"+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function parseBackup(txt){
  txt=String(txt||"");
  const valid=o=>o&&Array.isArray(o.jobs)&&o.settings?o:null;
  const m=txt.match(/HONESTECH-PPI-BACKUP/i);
  if(!m)return null;
  let rest=txt.slice(m.index+m[0].length);
  // New format: base64url after "-V2-"
  const v2=rest.match(/^\s*-\s*V2\s*-/i);
  if(v2){
    try{
      let s=rest.slice(v2[0].length).replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
      while(s.length%4)s+="=";
      const bin=atob(s);const bytes=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)bytes[k]=bin.charCodeAt(k);
      return valid(JSON.parse(new TextDecoder().decode(bytes)));
    }catch(e){return null;}
  }
  // Old format: raw JSON, possibly URL-encoded or with curly quotes from Notes
  for(let pass=0;pass<3&&/%[0-9A-Fa-f]{2}/.test(rest);pass++){
    try{rest=decodeURIComponent(rest.replace(/\+/g," "));}catch(e){break;}
  }
  rest=rest.replace(/[“”„‟″]/g,'"').replace(/[‘’‚‛′]/g,"'");
  const a=rest.indexOf("{"),b=rest.lastIndexOf("}");
  if(a<0||b<a)return null;
  try{return valid(JSON.parse(rest.slice(a,b+1)));}catch(e){return null;}
}

const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==="function");
let CLAUDE_DL=null,CLAUDE_DL_READY=null;
if(IN_CLAUDE)CLAUDE_DL_READY=window.claude.use("downloads").then(d=>(CLAUDE_DL=d)).catch(()=>null);
function webSaveAvailable(){return !IN_CLAUDE&&typeof Blob!=="undefined";}
async function getSaver(){
  if(IN_CLAUDE){const d=CLAUDE_DL||await CLAUDE_DL_READY;return d?{save:(filename,data)=>d.save({filename,data}).then(r=>r.status)}:null;}
  if(!webSaveAvailable())return null;
  return {save:async(filename,data)=>{
    const type=/\.pdf$/i.test(filename)?"application/pdf":"text/plain";
    const blob=data instanceof Blob?data:new Blob([data],{type});
    let file=null;try{file=new File([blob],filename,{type:blob.type||type});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return "saved";}
      catch(e){if(e&&e.name==="AbortError")throw {code:"declined"};}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);return "saved";
  }};
}

const MDB={_p:null,

    r.onupgradeneeded=()=>r.result.createObjectStore("m");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("m",mode);const st=t.objectStore("m");const out=fn(st);
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(id,v){return this.tx("readwrite",st=>st.put(v,id));},

};

let MEDIA_DEL=null;
const MTAGS=[["before","Before"],["after","After"],["finding","Finding"]];
const extOf=m=>/png/.test(m)?"png":/jpe?g/.test(m)?"jpg":/quicktime/.test(m)?"mov":/mp4/.test(m)?"mp4":/webm/.test(m)?"webm":/video/.test(m)?"mov":"jpg";
const fmtDur=s=>s?`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`:"";
function readAsDataURL(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(blob);});}
function imgFromBlob(blob){return new Promise(r=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{r(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=()=>{r(null);URL.revokeObjectURL(u)};im.src=u;});}
function drawTo(src,w0,h0,max,q){const sc=Math.min(1,max/Math.max(w0,h0));const c=document.createElement("canvas");c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);return c;}
function canvasBlob(c,q){return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",q));}
function videoThumb(file){return new Promise(res=>{const u=URL.createObjectURL(file),v=document.createElement("video");let done=false;
  const fin=x=>{if(done)return;done=true;URL.revokeObjectURL(u);res(x);};
  v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";v.src=u;
  v.onloadedmetadata=()=>{const dur=isFinite(v.duration)?v.duration:0;try{v.currentTime=Math.min(0.5,dur/2||0);}catch(e){}
    v.onseeked=()=>{try{const c=drawTo(v,v.videoWidth||320,v.videoHeight||240,320);fin({thumb:c.toDataURL("image/jpeg",0.7),dur});}catch(e){fin({thumb:"",dur});}};};
  v.onerror=()=>fin({thumb:"",dur:0});setTimeout(()=>fin({thumb:"",dur:0}),6000);});}
async function addMediaFiles(job,files,kind){
  job.media=job.media||[];let n=0,fail=0;
  for(const f of files){
    const id="m_"+uid(),tag=job.media.some(m=>m.tag==="before")?"after":"before";
    try{
      if(kind==="photo"){
        const im=await imgFromBlob(f);if(!im){fail++;continue;}
        const full=await canvasBlob(drawTo(im,im.naturalWidth,im.naturalHeight,1600),0.8);
        const thumb=drawTo(im,im.naturalWidth,im.naturalHeight,320).toDataURL("image/jpeg",0.7);
        await MDB.put(id,{buf:await full.arrayBuffer(),type:"image/jpeg"});
        job.media.push({id,kind,tag,cap:"",thumb,mime:"image/jpeg",size:full.size,at:Date.now()});
      }else{
        toast(`Saving video${files.length>1?` ${n+1} of ${files.length}`:""}…`);
        const {thumb,dur}=await videoThumb(f);
        await MDB.put(id,{buf:await f.arrayBuffer(),type:f.type||"video/quicktime"});
        job.media.push({id,kind,tag,cap:"",thumb,mime:f.type||"video/quicktime",size:f.size,dur,at:Date.now()});
      }
      n++;
    }catch(e){console.error(e);fail++;}
  }
  save();
  return {n,fail};
}
async function preloadMedia(job){
  const list=(job&&job.media)||[];let i=0;
  for(const m of list){i++;
    if(MEDIA_FILE[m.id])continue;
    try{const rec=await MDB.get(m.id);if(!rec)continue;
      const name=`${(job.info.customer||"job").replace(/[^A-Za-z0-9]+/g,"-")}-${m.tag}-${i}.${extOf(rec.type)}`;
      const blob=new Blob([rec.buf],{type:rec.type});MEDIA_FILE[m.id]=new File([blob],name,{type:rec.type});
      if(m.kind==="photo")MEDIA_URL[m.id]=await readAsDataURL(blob);
    }catch(e){console.error(e);}
  }
}
async function deleteJobMedia(job){for(const m of (job&&job.media)||[]){try{await MDB.del(m.id);}catch(e){} delete MEDIA_FILE[m.id];delete MEDIA_URL[m.id];}}

async function openViewer(id){
  const m=(S.media||[]).find(x=>x.id===id);if(!m)return;
  let f=MEDIA_FILE[id];if(!f){await preloadMedia(S);f=MEDIA_FILE[id];}
  if(!f){toast("This file isn't on this phone.");return;}
  const u=MEDIA_OBJ[id]||(MEDIA_OBJ[id]=URL.createObjectURL(f));
  const ov=document.createElement("div");ov.className="viewer";ov.innerHTML=`<div class="vbox">${m.kind==="video"?`<video src="${u}" controls playsinline autoplay></video>`:`<img src="${u}" alt="${esc(m.cap||"Photo")}">`}
    <div class="vcap">${esc((Object.fromEntries(MTAGS)[m.tag]||"")+(m.cap?" · "+m.cap:""))}</div><button class="btn" type="button" data-vclose="1">Close</button></div>`;
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest("[data-vclose]"))ov.remove();});
  document.body.appendChild(ov);
}
function shareMedia(){
  const ms=S.media||[],files=ms.map(m=>MEDIA_FILE[m.id]).filter(Boolean);
  if(!files.length){toast("Still loading, try again in a second.");preloadMedia(S);return;}
  if(!(navigator.canShare&&navigator.canShare({files}))){toast("Sharing photos and videos isn't supported here.");return;}
  const i=S.info,text=`${vehOf(i)||"Your vehicle"}: ${i.work||"service"} — photos and videos from ${bizName()}.`;
  navigator.share({files,text}).catch(e=>{if(e&&e.name!=="AbortError")toast("Couldn't share. Try fewer or shorter videos.");});
}

function payOptions(amount){
  const s=APP.settings,amt=Math.max(0,Math.round(num(amount)*100)/100),a2=amt?amt.toFixed(2):"",out=[];
  const ca=String(s.payCashapp||"").trim().replace(/^\$?/,"");
  if(ca)out.push({k:"Cash App",v:"$"+ca,href:`https://cash.app/$${encodeURIComponent(ca)}${a2?"/"+a2:""}`});
  const vm=String(s.payVenmo||"").trim().replace(/^@/,"");
  if(vm)out.push({k:"Venmo",v:"@"+vm,href:`https://venmo.com/?txn=pay&recipients=${encodeURIComponent(vm)}${a2?"&amount="+a2:""}`});
  const zl=String(s.payZelle||"").trim();
  if(zl)out.push({k:"Zelle",v:zl,href:""});
  let pp=String(s.payPaypal||"").trim();
  if(pp){const m=pp.match(/paypal\.me\/([^/?#\s]+)/i),user=m?m[1]:(/@/.test(pp)?"":pp.replace(/^@/,""));
    out.push({k:"PayPal",v:user?`paypal.me/${user}`:pp,href:user?`https://paypal.me/${encodeURIComponent(user)}${a2?"/"+a2+"USD":""}`:""});}

}

/* ================= PDF export ================= */
const PC={ink:[21,32,43],muted:[91,104,118],line:[213,219,226],paper:[244,246,248],
  good:[31,122,69],mon:[154,98,0],bad:[180,35,35],na:[107,116,128],
  goodS:[225,242,232],monS:[251,240,217],badS:[251,228,228],naS:[236,239,242]};
Object.defineProperty(PC,"accent",{get(){const st=APP.settings;if(st.pdfAccent&&st.themeAccent){const a=accentFor(st.themeAccent,false,[255,255,255]);if(a)return a.map(Math.round);}return [29,95,168];}});
const PW=612,PH=792,PM=40;
const pdfTxt=s=>String(s??"").replace(/[′]/g,"'").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF–—‘’“”•…]/g,"");
function pdfStart(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"letter",compress:true});
  const P={doc,y:PM};
  P.font=(size,style="normal",color=PC.ink)=>{doc.setFont("helvetica",style);doc.setFontSize(size);doc.setTextColor(...color);};
  P.need=(h)=>{if(P.y+h>PH-PM-24){doc.addPage();P.y=PM;return true;}return false;};
  P.text=(s,x,y,o)=>doc.text(Array.isArray(s)?s.map(pdfTxt):pdfTxt(s),x,y,o);
  P.wrap=(s,w)=>doc.splitTextToSize(pdfTxt(s),w);
  P.rule=(y,c=PC.line,w=0.75)=>{doc.setDrawColor(...c);doc.setLineWidth(w);doc.line(PM,y,PW-PM,y);};
  return P;
}
function pdfHeader(P,title,rightLines){

function pdfKV(P,pairs,cols=3){

function pdfItemRow(P,it,r,withSection){

function pdfCorners(P,x,y,title,it,r){
  const v=(r&&typeof r.val==="object"&&r.val)||{},bw=78,bh=30,gap=6;

  P.font(6.5,"bold",PC.muted);P.text("FRONT",x+bw+gap/2,y+12,{align:"center"});

    const cr=cornerRate(it.corners,v[k]);const col=cr?PC[cr]:PC.line,soft=cr?PC[cr+"S"]:PC.paper;

async function savePdf(kind){
  if(!window.jspdf){toast("The PDF tool didn't load. Check your connection and try again.");return;}
  const dl=await getSaver();
  if(!dl){toast("Saving PDFs isn't available in this view.");return;}
  if(!APP.settings.biz.trim()){toast("Add your business name in Settings first. It goes at the top of the PDF.");return;}
  const i=S.info,slug=s=>String(s||"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
  let blob,filename;
  try{
    if(kind==="report"){blob=buildReportPdf(S);filename=`PPI-${slug(vehOf(i))||"Report"}-${i.date||TODAY}.pdf`;}
    else if(kind==="estimate"){blob=buildInvoicePdf(S,true);save();filename=`Estimate-${slug(S.est.num)}${i.customer?"-"+slug(i.customer):""}.pdf`;}
    else{blob=buildInvoicePdf(S);save();filename=`Invoice-${slug(S.invoice.num)}${i.customer?"-"+slug(i.customer):""}.pdf`;}
  }catch(e){console.error(e);toast("Couldn't build the PDF.");return;}
  try{const st=await dl.save(filename,blob);if(st==="saved")toast("PDF ready");}
  catch(e){
    if(e&&e.code==="declined")return;
    if(e&&e.code==="rate_limited"){toast("A save is already open. Finish that one first.");return;}
    toast("Couldn't save the PDF here.");
  }
}

  if(d.lnd!==undefined){S.invoice.lines[+d.lnd].d=t.value;save();return;}
  if(d.lnq!==undefined||d.lnp!==undefined){const k=+(d.lnq??d.lnp),x=S.invoice.lines[k];if(d.lnq!==undefined)x.q=t.value;else x.p=t.value;
    const a=document.getElementById("ln-a-"+k);if(a)a.textContent=money(lineAmt(x));save();refreshTotals();return;}
  if(d.itd!==undefined){S.invoice.items[+d.itd].d=t.value;save();return;}
  if(d.ita!==undefined){S.invoice.items[+d.ita].a=t.value;save();refreshTotals();return;}
  if(d.note){res(d.note).note=t.value;save();return;}
  if(d.val){res(d.val).val=t.value;save();return;}
  if(d.corner){
    const [id,k]=d.corner.split(":");const it=ALL_ITEMS.find(x=>x.id===id);const r=res(id);const v=cornerVals(r);v[k]=t.value;
    t.closest(".corner").dataset.cr=cornerRate(it.corners,t.value);
    if(!r.r||r.auto){
      const rs=CORNERS.map(([c])=>cornerRate(it.corners,v[c])).filter(Boolean);
      r.r=rs.includes("bad")?"bad":rs.includes("mon")?"mon":rs.length?"good":"";r.auto=true;
      const el=t.closest(".item");el.dataset.r=r.r;el.querySelectorAll("[data-rate]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.rate===r.r)));
    }
    if(S.status==="sched")S.status="active";
    save();renderChrome();
  }
});
function refreshTotals(){const box=$("#totals");if(!box)return;const t=totals(S);box.innerHTML=totalsHTML(t);const tr=$("#inv-travel");if(tr)tr.placeholder=t.travel.auto?String(t.travel.fee):"";}
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.setc){APP.settings[d.setc]=t.checked;save();return;}
  if(d.compact){APP.compact=t.checked;save();rerenderKeep();return;}
  if(d.assign){const j=APP.jobs.find(x=>x.id===d.assign);if(j){const tm=teamList().find(x=>x.id===t.value);j.techId=tm?tm.id:"";j.info.tech=tm?tm.name:"";if(!tm)j.dispatch="";else if(!j.dispatch)j.dispatch="assigned";save();rerenderKeep();toast(tm?`Assigned to ${tm.name}`:"Unassigned");}return;}
  if(d.draftc&&APP.draft){APP.draft[d.draftc]=t.checked;save();return;}
  if(d.reqc&&REQ_EDIT){REQ_EDIT[d.reqc]=t.checked;return;}
  if(d.restorefile){const f=t.files&&t.files[0];if(!f)return;
    const fr=new FileReader();fr.onload=()=>{const o=parseBackup(String(fr.result||""));t.value="";
      if(!o){toast("That file isn't a Honestech app backup.");return;}
      $("#restoreIn").value=String(fr.result);
      $("#restoreActs").innerHTML=`<div class="confirm" style="width:100%"><span>Replace everything on this phone with <strong>${esc(f.name)}</strong> (${o.jobs.length} job${o.jobs.length===1?"":"s"}, ${esc(o.settings.biz||"no business name")})?</span><button class="btn danger" type="button" data-act="doRestore">Replace with backup</button><button class="btn" type="button" data-act="cancelRestore">Cancel</button></div>`;
      $("#restoreActs").scrollIntoView({block:"center"});};
    fr.onerror=()=>toast("Couldn't open that file.");fr.readAsText(f);return;}
  if(d.logo){const f=t.files&&t.files[0];if(!f)return;
    loadLogo(f).then(r=>{if(!r){toast("Couldn't read that image. Try a PNG or JPG.");return;}
      Object.assign(APP.settings,r);save();render();toast("Logo saved");});return;}
  if(d.bkphotos){APP.bkPhotos=t.checked;save();return;}
  if(d.invc){S.invoice[d.invc]=t.checked;save();refreshTotals();return;}
  if(d.lnk!==undefined){const k=+d.lnk,x=S.invoice.lines[k];x.k=t.value;if(x.k==="flat")x.q="1";if(x.k==="labor"&&!x.p&&APP.settings.laborRate)x.p=APP.settings.laborRate;save();render();refreshTotals();return;}
  if(d.set==="hq"){checkHQ();return;}
  if(d.exprc&&EXP_DRAFT){const f=t.files&&t.files[0];t.value="";if(!f)return;const dr=EXP_DRAFT;
    imgFromBlob(f).then(im=>{if(!im){toast("Couldn't read that photo");return;}const c=drawTo(im,im.naturalWidth,im.naturalHeight,1400);dr.rcData=c.toDataURL("image/jpeg",0.72);if(EXP_DRAFT===dr)rerenderKeep();});return;}
  if(d.exp==="jobId"&&EXP_DRAFT){EXP_DRAFT.jobId=t.value;return;}
  if(d.mkind){const [id,k]=d.mkind.split(":");const it=APP.settings.menu.find(x=>x.id===id);const x=it&&it.lines[+k];if(!x)return;x.k=t.value;if(x.k==="flat")x.q="1";save();rerenderKeep();return;}
  if(d.themecustom){save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(d.draft==="location"&&hasHQ()&&t.value.trim()){calcDist("draft",true);return;}
  if(d.info==="location"&&hasHQ()&&t.value.trim()&&S){calcDist("info",true);return;}
  if(d.set&&APP.view==="settings")return;
  if(d.media){const files=[...t.files];t.value="";if(!files.length)return;const job=S;
    addMediaFiles(job,files,d.media).then(({n,fail})=>{if(S===job){const y=window.scrollY;render();window.scrollTo(0,y);}
      toast(fail?`Saved ${n}, ${fail} couldn't be saved (phone storage may be full)`:`${n} ${d.media==="video"?"video":"photo"}${n===1?"":"s"} added`);});return;}
  if(!d.photo)return;const id=d.photo;
  const files=[...t.files];if(!files.length)return;
  Promise.all(files.map(shrink)).then(urls=>{res(id).photos.push(...urls.filter(Boolean));save();
    const el=document.querySelector(`[data-item="${id}"]`);if(el)el.outerHTML=renderItem(ALL_ITEMS.find(x=>x.id===id));toast(urls.length>1?`${urls.length} photos added`:"Photo added");});
});
function loadLogo(file){
  return new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,600/img.width,300/img.height);const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
    g.fillStyle="#ffffff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    resolve({logo:c.toDataURL("image/jpeg",0.9),logoW:w,logoH:h});};img.onerror=()=>resolve(null);img.src=fr.result;};fr.onerror=()=>resolve(null);fr.readAsDataURL(file);});
}
function shrink(file){
  return new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const max=900,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",0.6));};img.onerror=()=>resolve(null);img.src=fr.result;};fr.onerror=()=>resolve(null);fr.readAsDataURL(file);});
}
